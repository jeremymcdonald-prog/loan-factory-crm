<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loan Factory CRM — Demonstration Build</title>
<style>
/* ==========================================================================
   Loan Factory CRM — demonstration build.
   Tokens copied from src/app/globals.css (light theme), verbatim.
   ========================================================================== */
:root{
  --brand-orange:#f36f28;
  --brand-ink:#050708;
  --action-primary:#c84d0b;
  --action-primary-hover:#ab420a;
  --action-primary-active:#983b08;
  --action-primary-fg:#ffffff;
  --action-tint:#fdf0e8;
  --action-tint-border:#f8d6c2;
  --navy:#0f1826;
  --navy-raised:#16202f;
  --navy-border:#222e40;
  --sidebar:var(--navy);
  --sidebar-fg:#e8ecf2;
  --sidebar-fg-muted:#97a2b2;
  --sidebar-fg-dim:#6b7789;
  --sidebar-hover:#172234;
  --sidebar-active:#1c2b43;
  --sidebar-border:#222e40;
  --canvas:#f5f6f8;
  --surface:#ffffff;
  --raised:#ffffff;
  --sunken:#f0f2f5;
  --border-subtle:#e4e8ed;
  --border-strong:#cfd5dd;
  --text-primary:#131a24;
  --text-secondary:#4e5866;
  --text-muted:#646e7c;
  --text-disabled:#a3abb7;
  --ai-fg:#6d4c8f;
  --ai-bg:#f2ecf7;
  --ai-border:#ddd0ea;
  --critical-fg:#b4291d;
  --critical-bg:#fdecea;
  --critical-border:#f6cfca;
  --warning-fg:#8a5a00;
  --warning-bg:#fdf4e3;
  --warning-border:#f3ddb0;
  --healthy-fg:#17724b;
  --healthy-bg:#e7f4ed;
  --healthy-border:#bfe0cf;
  --info-fg:#1d63c4;
  --info-bg:#eaf2fe;
  --info-border:#c6dcfa;
  --neutral-fg:#646e7c;
  --neutral-bg:#f0f2f5;
  --neutral-border:#dfe4ea;
  --shadow-1:0 1px 2px rgb(19 26 36 / .04),0 1px 3px rgb(19 26 36 / .06);
  --shadow-2:0 4px 10px -2px rgb(19 26 36 / .07),0 2px 4px -2px rgb(19 26 36 / .04);
  --shadow-3:0 14px 26px -6px rgb(19 26 36 / .11),0 5px 10px -4px rgb(19 26 36 / .05);
  --radius-card:.75rem;
  --radius-control:.5rem;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:light}
body{
  background:var(--canvas);color:var(--text-primary);
  font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:.875rem;line-height:1.375rem;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  height:100vh;overflow:hidden;
}
.tnum,table{font-variant-numeric:tabular-nums lining-nums}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text-primary)}
a{color:inherit;text-decoration:none}
*:focus-visible{outline:2px solid var(--brand-orange);outline-offset:2px;border-radius:3px}
::selection{background:rgba(243,111,40,.24)}

/* ---- shell -------------------------------------------------------------- */
.app{display:flex;height:100vh}
#sidebar{width:236px;flex-shrink:0;background:var(--sidebar);color:var(--sidebar-fg-muted);display:flex;flex-direction:column}
.sb-logo{display:flex;align-items:center;height:64px;padding:0 20px}
.sb-logo img{height:26px;width:auto;display:block}
.sb-nav{flex:1;padding:4px 12px 12px;overflow-y:auto}
.sb-hr{border:0;border-top:1px solid var(--sidebar-border);margin:8px 8px}
.navitem{position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:10px 12px 10px 14px;border-radius:var(--radius-control);color:var(--sidebar-fg-muted);
  font-size:.75rem;line-height:1rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;transition:background .12s,color .12s}
.navitem:hover{background:var(--sidebar-hover);color:var(--sidebar-fg)}
.navitem.active{background:var(--sidebar-active);color:var(--sidebar-fg)}
.navitem.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:99px;background:var(--brand-orange)}
.navitem svg{width:18px;height:18px;flex-shrink:0;stroke:currentColor}
.navitem.active svg{stroke:var(--brand-orange)}
.nav-count{margin-left:auto;background:var(--brand-orange);color:#fff;border-radius:99px;padding:1px 6px;font-size:.6875rem;font-weight:600}
.sb-foot{border-top:1px solid var(--sidebar-border);padding:14px 24px;font-size:.6875rem;line-height:1rem;color:var(--sidebar-fg-dim)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{height:56px;flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--border-subtle);
  display:flex;align-items:center;gap:12px;padding:0 20px}
#topbar h1{font-size:1.0625rem;line-height:1.5rem;font-weight:600;letter-spacing:-.01em}
.demo-chip{display:inline-flex;align-items:center;gap:6px;background:var(--warning-bg);border:1px solid var(--warning-border);
  color:var(--warning-fg);border-radius:99px;padding:2px 10px;font-size:.75rem;font-weight:600;white-space:nowrap}
.demo-chip::before{content:"";width:7px;height:7px;border-radius:99px;background:var(--warning-fg)}
.topbar-user{margin-left:auto;text-align:right}
.topbar-user .nm{font-size:.8125rem;font-weight:600}
.topbar-user .rl{font-size:.6875rem;color:var(--text-muted)}
.avatar{width:32px;height:32px;border-radius:99px;background:var(--action-tint);border:1px solid var(--action-tint-border);
  color:var(--action-primary);display:grid;place-items:center;font-size:.75rem;font-weight:700}
#view{flex:1;overflow:auto;background:var(--canvas)}
#demofooter{flex-shrink:0;background:var(--navy);border-top:1px solid var(--navy-border);color:var(--sidebar-fg-muted);
  text-align:center;font-size:.75rem;padding:7px 12px;letter-spacing:.02em}

/* ---- primitives --------------------------------------------------------- */
.wrap{max-width:64rem;margin:0 auto;padding:16px 24px 32px}
.wrap-wide{max-width:none;padding:16px 24px 32px}
.card{background:var(--surface);border:1px solid var(--border-subtle);border-radius:var(--radius-card);box-shadow:var(--shadow-1)}
.page-head{padding:20px 24px 14px}
.page-head h2{font-size:1.375rem;line-height:1.875rem;font-weight:600;letter-spacing:-.01em}
.page-head p{color:var(--text-secondary);margin-top:2px}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:6px;border:1px solid;padding:1px 7px;font-size:.75rem;font-weight:600;white-space:nowrap}
.b-neutral{background:var(--neutral-bg);border-color:var(--neutral-border);color:var(--neutral-fg)}
.b-healthy{background:var(--healthy-bg);border-color:var(--healthy-border);color:var(--healthy-fg)}
.b-warning{background:var(--warning-bg);border-color:var(--warning-border);color:var(--warning-fg)}
.b-critical{background:var(--critical-bg);border-color:var(--critical-border);color:var(--critical-fg)}
.b-info{background:var(--info-bg);border-color:var(--info-border);color:var(--info-fg)}
.b-ai{background:var(--ai-bg);border-color:var(--ai-border);color:var(--ai-fg)}
.b-action{background:var(--action-tint);border-color:var(--action-tint-border);color:var(--action-primary)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border-radius:var(--radius-control);
  font-size:.875rem;font-weight:600;transition:background .12s,border-color .12s}
.btn-primary{background:var(--action-primary);color:var(--action-primary-fg);box-shadow:var(--shadow-1)}
.btn-primary:hover{background:var(--action-primary-hover)}
.btn-ghost{border:1px solid var(--border-strong);background:var(--surface);color:var(--text-primary)}
.btn-ghost:hover{background:var(--sunken)}
.btn[disabled]{opacity:.45;cursor:not-allowed;pointer-events:none}
.btn-sm{height:28px;padding:0 10px;font-size:.8125rem}
.input,select.input,textarea.input{height:38px;border:1px solid var(--border-strong);background:var(--surface);
  border-radius:var(--radius-control);padding:0 12px;font-size:.875rem;width:100%}
textarea.input{height:auto;padding:8px 12px;resize:vertical}
.input::placeholder{color:var(--text-muted)}
.input:focus{outline:none;border-color:var(--brand-orange)}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:var(--border-subtle);
  border:1px solid var(--border-subtle);border-radius:var(--radius-card);overflow:hidden}
.stat{background:var(--surface);padding:12px 16px}
.stat .lb{font-size:.75rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted)}
.stat .vl{font-size:1.3125rem;line-height:1.75rem;font-weight:600;margin-top:4px}
.stat .mt{font-size:.8125rem;color:var(--text-muted)}
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--border-subtle);padding:0 4px}
.tab{padding:8px 12px;font-size:.875rem;font-weight:600;color:var(--text-secondary);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--text-primary)}
.tab.on{color:var(--action-primary);border-bottom-color:var(--brand-orange)}
.tab .ct{font-weight:400;color:var(--text-muted);margin-left:4px}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:99px;border:1px solid var(--border-strong);background:var(--surface);
  padding:3px 11px;font-size:.8125rem;color:var(--text-secondary);transition:border-color .12s,color .12s}
.chip:hover{border-color:var(--brand-orange);color:var(--action-primary)}
.chip.on{background:var(--action-tint);border-color:var(--action-tint-border);color:var(--action-primary);font-weight:600}
.chip-ai{border-color:var(--ai-border)}
.chip-ai:hover,.chip-ai.on{border-color:var(--ai-fg);color:var(--ai-fg);background:var(--surface)}
table.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:.75rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted);
  text-align:left;padding:9px 14px;border-bottom:1px solid var(--border-subtle);white-space:nowrap}
.tbl td{padding:10px 14px;border-bottom:1px solid var(--border-subtle);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr.rowlink{cursor:pointer}
.tbl tr.rowlink:hover td{background:var(--sunken)}
.muted{color:var(--text-muted)}.sec{color:var(--text-secondary)}
.small{font-size:.8125rem;line-height:1.25rem}
.micro{font-size:.6875rem;line-height:.875rem}
.lang-badge{display:inline-flex;border-radius:5px;border:1px solid var(--info-border);background:var(--info-bg);color:var(--info-fg);
  padding:0 5px;font-size:.6875rem;font-weight:700;letter-spacing:.04em}
.section-title{font-size:.9375rem;line-height:1.375rem;font-weight:600;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.bar-row{display:grid;grid-template-columns:150px 1fr 64px;gap:10px;align-items:center;padding:4px 0}
.bar-track{height:10px;background:var(--sunken);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;border-radius:99px;background:var(--brand-orange)}
.bar-fill.dim{background:var(--border-strong)}
.bar-fill.crit{background:var(--critical-fg)}
.bar-fill.ai{background:var(--ai-fg)}
.empty{padding:44px 24px;text-align:center;color:var(--text-secondary)}
details.why summary{cursor:pointer;font-size:.8125rem;font-weight:600;color:var(--ai-fg);list-style:none}
details.why summary::before{content:"▸ "}
details.why[open] summary::before{content:"▾ "}
details.why .body{margin-top:6px}

/* ---- today / assistant -------------------------------------------------- */
.ai-panel{border:1px solid var(--ai-border);background:rgba(242,236,247,.4);border-radius:var(--radius-card);overflow:hidden}
.ai-head{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--ai-border);padding:12px 16px}
.ai-head h2{font-size:1.0625rem;font-weight:600;letter-spacing:-.01em;flex:1;min-width:0}
.ai-mark{width:22px;height:22px;flex-shrink:0;border-radius:7px;background:var(--ai-bg);border:1px solid var(--ai-border);
  color:var(--ai-fg);display:grid;place-items:center;font-size:.6875rem;font-weight:800}
.ai-thread{max-height:400px;overflow-y:auto;padding:12px 16px}
.msg-row{display:flex;margin-top:12px}
.msg-row.user{justify-content:flex-end}
.msg-row.assistant{align-items:flex-start;gap:10px}
.bubble{max-width:86%;white-space:pre-wrap;border-radius:var(--radius-card);border:1px solid;padding:8px 12px;font-size:.8125rem;line-height:1.3rem}
.bubble.user{border-color:var(--border-subtle);background:var(--sunken)}
.bubble.assistant{border-color:var(--ai-border);background:var(--surface);color:var(--text-secondary)}
.ai-chips{display:flex;flex-wrap:wrap;gap:6px;border-top:1px solid rgba(221,208,234,.6);padding:10px 16px}
.ai-form{display:flex;gap:8px;border-top:1px solid rgba(221,208,234,.6);padding:12px 16px}
.briefing-lead{color:var(--text-secondary)}
.briefing-b{display:flex;gap:8px;align-items:flex-start;color:var(--text-secondary);margin-top:5px}
.briefing-b::before{content:"";width:6px;height:6px;border-radius:99px;background:rgba(109,76,143,.6);margin-top:8px;flex-shrink:0}
.appr-card{border:1px solid var(--ai-border);background:var(--surface);border-radius:var(--radius-card);padding:14px 16px;margin-top:10px}
.appr-note{border:1px solid var(--healthy-border);background:var(--healthy-bg);color:var(--healthy-fg);border-radius:var(--radius-card);
  padding:9px 14px;margin-top:10px;font-size:.8125rem;font-weight:600}
.draft-body{white-space:pre-wrap;border:1px solid var(--border-subtle);background:var(--sunken);border-radius:var(--radius-control);
  padding:10px 12px;margin-top:10px;font-size:.8125rem;line-height:1.3rem;color:var(--text-secondary)}

/* ---- pipeline ----------------------------------------------------------- */
.kanban{display:flex;gap:12px;overflow-x:auto;padding:16px 24px 28px}
.kcol{width:280px;flex-shrink:0;display:flex;flex-direction:column}
.kcol-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px;padding:0 2px}
.kcol-head h3{font-size:.75rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.kcol-body{flex:1;background:rgba(240,242,245,.6);border-radius:.5rem;padding:8px;display:flex;flex-direction:column;gap:12px}
.kstage-lb{display:flex;justify-content:space-between;padding:0 2px;margin-bottom:6px;font-size:.8125rem;font-weight:600;color:var(--text-secondary)}
.loan-card{background:var(--surface);border:1px solid var(--border-subtle);border-radius:var(--radius-control);
  box-shadow:var(--shadow-1);padding:10px 12px;margin-bottom:6px}
.loan-card .nm{font-weight:600;font-size:.875rem}
.loan-card .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
.amount-chip{display:inline-flex;border-radius:5px;background:var(--sunken);border:1px solid var(--border-subtle);
  padding:0 6px;font-size:.75rem;font-weight:600;color:var(--text-secondary)}
.urg{font-size:.75rem;font-weight:600;margin-top:6px}
.urg.crit{color:var(--critical-fg)}
.urg.warn{color:var(--warning-fg)}

/* ---- conversations ------------------------------------------------------ */
.conv-split{display:flex;gap:16px;padding:16px 24px 28px;align-items:flex-start}
.conv-list{width:340px;flex-shrink:0}
.conv-item{display:block;width:100%;text-align:left;padding:11px 14px;border-bottom:1px solid var(--border-subtle)}
.conv-item:last-child{border-bottom:none}
.conv-item:hover{background:var(--sunken)}
.conv-item.on{background:var(--action-tint)}
.conv-thread{flex:1;min-width:0}
.thread-msgs{padding:16px;display:flex;flex-direction:column;gap:12px}
.tmsg{max-width:78%;border-radius:var(--radius-card);border:1px solid var(--border-subtle);padding:10px 14px;font-size:.875rem;white-space:pre-wrap}
.tmsg.in{align-self:flex-start;background:var(--surface)}
.tmsg.out{align-self:flex-end;background:var(--sunken)}
.tmsg .stamp{font-size:.6875rem;color:var(--text-muted);margin-top:6px;white-space:normal}
.trans{margin-top:8px;white-space:normal}
.trans .body{white-space:pre-wrap;border-left:3px solid var(--ai-border);padding-left:10px;margin-top:6px;color:var(--text-secondary);font-size:.8125rem}
.video-card{margin-top:10px;border:1px solid var(--border-strong);border-radius:var(--radius-control);overflow:hidden;background:var(--navy);max-width:300px;white-space:normal}
.video-thumb{position:relative;height:110px;display:grid;place-items:center;background:linear-gradient(135deg,#16202f,#0f1826)}
.video-thumb .play{width:40px;height:40px;border-radius:99px;background:rgba(243,111,40,.9);display:grid;place-items:center}
.video-thumb .play::before{content:"";border-style:solid;border-width:7px 0 7px 12px;border-color:transparent transparent transparent #fff;margin-left:3px}
.video-thumb .dur{position:absolute;right:8px;bottom:8px;background:rgba(5,7,8,.7);color:#fff;font-size:.6875rem;font-weight:600;border-radius:4px;padding:1px 5px}
.video-meta{background:var(--surface);padding:8px 10px}
.video-meta .t{font-weight:600;font-size:.8125rem}
.video-meta .c{font-size:.75rem;color:var(--text-muted)}

/* ---- marketing / videos / team ------------------------------------------ */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.mk-card{background:var(--surface);border:1px solid var(--border-subtle);border-radius:var(--radius-card);box-shadow:var(--shadow-1);padding:14px 16px}
.mk-nums{display:flex;gap:18px;margin-top:10px}
.mk-nums .n .v{font-size:1.0625rem;font-weight:600}
.mk-nums .n .l{font-size:.6875rem;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);font-weight:600}
.tpl-row{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--border-subtle)}
.tpl-row:last-child{border-bottom:none}
.vid-card{background:var(--surface);border:1px solid var(--border-subtle);border-radius:var(--radius-card);box-shadow:var(--shadow-1);overflow:hidden}
.vid-card .ph{height:120px;background:linear-gradient(135deg,#16202f,#0f1826);display:grid;place-items:center;position:relative}
.vid-card .ph .play{width:38px;height:38px;border-radius:99px;background:rgba(232,236,242,.16);display:grid;place-items:center}
.vid-card .ph .play::before{content:"";border-style:solid;border-width:6px 0 6px 11px;border-color:transparent transparent transparent #e8ecf2;margin-left:3px}
.team-split{display:flex;gap:16px;padding:16px 24px 28px;align-items:flex-start}
.share-bar{width:120px;height:8px;background:var(--sunken);border-radius:99px;overflow:hidden;display:inline-block;vertical-align:middle}
.share-bar i{display:block;height:100%;background:var(--brand-orange);border-radius:99px}

/* ---- compose ------------------------------------------------------------ */
.form-row{margin-top:14px}
.form-row label{display:block;font-size:.75rem;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--text-muted);margin-bottom:5px}
.note-box{border:1px solid var(--warning-border);background:var(--warning-bg);color:var(--warning-fg);border-radius:var(--radius-control);
  padding:9px 12px;font-size:.8125rem;margin-top:10px}
.preview-video{width:100%;max-height:280px;background:#050708;border-radius:var(--radius-control);display:block}

@media (max-width: 900px){
  #sidebar{width:64px}
  #sidebar .navitem span,.sb-foot,.sb-logo img{display:none}
  .sb-logo::after{content:"LF";color:var(--brand-orange);font-weight:800;font-size:1rem}
  .conv-split,.team-split{flex-direction:column}
  .conv-list{width:100%}
}
</style>
</head>
<body>
<div class="app">
  <nav id="sidebar" aria-label="Main"></nav>
  <div class="main">
    <header id="topbar"></header>
    <main id="view"></main>
    <footer id="demofooter">Loan Factory CRM Demonstration Build – Not Connected To Live Systems.</footer>
  </div>
</div>

rsAgo":0}]},{"id":"259225f4-bf3b-4637-8f12-0d2bb52e9103","subject":"Cảm ơn anh đã giới thiệu khách hàng","channel":"email","awaiting_reply":false,"with_name":"Chi Hoàng","language":"vi","owner":"Thúy Phạm","messages":[{"direction":"outbound","body":"Chào anh,\n\nEm gửi một video ngắn cảm ơn anh đã tin tưởng giới thiệu khách. Em cũng chia sẻ nhanh tình hình hồ sơ để anh tiện theo dõi.\n\n[Video: Cảm ơn đối tác]\n\nIf the video doesn't load, use this link instead.","status":"draft","preparedByAi":false,"translationEn":null,"video":{"demo":true,"title":"Cảm ơn đối tác","caption":"Video 90 giây","durationSeconds":92},"hoursAgo":0}]},{"id":"ef23cf12-b679-463e-ba92-b846055bfe65","subject":"Un mensaje rápido sobre sus documentos","channel":"email","awaiting_reply":false,"with_name":"Lucía Gómez","language":"es","owner":"Carlos Mendoza","messages":[{"direction":"outbound","body":"Hola María,\n\nLe grabé un video corto explicando exactamente qué documentos faltan y cómo enviarlos desde su teléfono — a veces es más fácil verlo que leerlo.\n\n[Video: Cómo enviar sus documentos]\n\nIf the video doesn't load, use this link instead.","status":"draft","preparedByAi":false,"translationEn":null,"video":{"demo":true,"title":"Cómo enviar sus documentos","caption":"Video de 2 minutos","durationSeconds":127},"hoursAgo":0}]},{"id":"1e3c8f2c-2533-4e31-bd82-babfa090bdad","subject":"July market update — video newsletter","channel":"email","awaiting_reply":false,"with_name":"James White","language":"en","owner":"Linh Trần","messages":[{"direction":"outbound","body":"Hi everyone,\n\nI recorded a short update on what we're seeing this month — inventory, buyer activity, and what it means if you're waiting to make a move.\n\n[Video: July market update]\n\nIf the video doesn't load, use this link instead.","status":"draft","preparedByAi":false,"translationEn":null,"video":{"demo":true,"title":"July market update","caption":"3-minute update from Linh","durationSeconds":184},"hoursAgo":0}]},{"id":"e8ee2ed3-05c4-4503-bd70-42960a58cec0","subject":"Your closing is Thursday","channel":"email","awaiting_reply":true,"with_name":"Thanh Nguyễn","language":"vi","owner":"Minh Nguyen","messages":[{"direction":"outbound","body":"Hi Thanh,\n\nYou're clear to close. The signing is set for Thursday at 8:00 AM at Chicago Title in Renton.\n\nBring a government photo ID. There's nothing else you need to do before then.\n\nMinh Nguyen\nNMLS 1856432\nCompany NMLS 320841\n\nEqual Housing Opportunity.","status":"sent","preparedByAi":false,"translationEn":null,"video":null,"hoursAgo":26},{"direction":"inbound","body":"Cảm ơn anh Minh. Tôi sẽ đến lúc 8 giờ.\n\nOne question — my rate lock expires Friday. Is that a problem if we sign Thursday?","status":"received","preparedByAi":false,"translationEn":null,"video":null,"hoursAgo":3}]},{"id":"6d3760d7-8b63-4edc-bda7-e224589a05f5","subject":"Hồ sơ của anh chị đã được duyệt có điều kiện","channel":"email","awaiting_reply":true,"with_name":"Chi Hoàng","language":"vi","owner":"Thúy Phạm","messages":[{"direction":"outbound","body":"Chào anh chị,\n\nTin vui — hồ sơ vay đã được duyệt có điều kiện. Ngân hàng chỉ cần thêm:\n\n• Giấy xác nhận việc làm mới nhất\n• Sao kê tài khoản tháng 6\n\nEm sẽ gọi chiều nay để giải thích rõ hơn.\n\nThúy Phạm\nNMLS 1901288\nCompany NMLS 320841\n\nCơ hội Nhà ở Bình đẳng.","status":"sent","preparedByAi":false,"translationEn":"Good news — your loan file has been conditionally approved. The lender only needs a current employment verification and your June bank statement. I'll call this afternoon to explain.","video":null,"hoursAgo":26},{"direction":"inbound","body":"Cảm ơn em Thúy nhiều lắm! Anh sẽ xin giấy xác nhận ngày mai. Gọi sau 5 giờ nhé, giờ đó anh mới xong việc.","status":"received","preparedByAi":false,"translationEn":"Thank you so much, Thúy! I'll request the verification letter tomorrow. Please call after 5 — I finish work then.","video":null,"hoursAgo":4}]},{"id":"bf49988f-14cd-434d-a7bd-4ea8168b7ac0","subject":"Quick question about the appraisal","channel":"email","awaiting_reply":true,"with_name":"Quang Lê","language":"vi","owner":"Minh Nguyen","messages":[{"direction":"inbound","body":"Minh — my wife asked whether the appraisal has come back yet. Also, do we need to do anything about the VOE you mentioned?","status":"received","preparedByAi":false,"translationEn":null,"video":null,"hoursAgo":5}]},{"id":"3a2f4c8d-8aa6-4e19-b9b8-8cf9f582de62","subject":"Documentos para su preaprobación","channel":"email","awaiting_reply":true,"with_name":"Lucía Gómez","language":"es","owner":"Carlos Mendoza","messages":[{"direction":"outbound","body":"Hola,\n\nGracias por su tiempo hoy. Para avanzar con la preaprobación necesito:\n\n• Talones de pago de las últimas 2 quincenas\n• W-2 de 2024\n• Estados de cuenta bancarios de 2 meses\n\nPuede enviarlos por foto desde su teléfono si es más fácil.\n\nCarlos Mendoza\nNMLS 1764201\nCompany NMLS 320841\n\nIgualdad de Oportunidades en la Vivienda.","status":"sent","preparedByAi":false,"translationEn":"Hello — thank you for your time today. To move forward with the preapproval I need: pay stubs for the last two pay periods, your 2024 W-2, and two months of bank statements. Photos from your phone are fine.","video":null,"hoursAgo":30},{"direction":"inbound","body":"Gracias Carlos. Mando todo el viernes cuando me paguen. ¿El W-2 lo puede sacar mi esposa de su portal del trabajo?","status":"received","preparedByAi":false,"translationEn":"Thank you Carlos. I'll send everything Friday when I get paid. Can my wife pull the W-2 from her work portal?","video":null,"hoursAgo":6}]},{"id":"6252c1ea-2b60-4a28-94d7-2bb167608e85","subject":"Ваша заявка — следующие шаги","channel":"email","awaiting_reply":true,"with_name":"Elena Sokolova","language":"ru","owner":"Elena Petrova","messages":[{"direction":"outbound","body":"Здравствуйте!\n\nСпасибо за разговор сегодня. Чтобы двигаться дальше, мне нужны:\n\n• Справки о зарплате за последние два месяца\n• Выписки с банковского счёта за 60 дней\n\nЕсли удобнее, можно прислать фотографии документов.\n\nElena Petrova\nNMLS 1922845\nCompany NMLS 320841\n\nРавные жилищные возможности.","status":"sent","preparedByAi":false,"translationEn":"Hello! Thank you for the conversation today. To move forward I need pay statements for the last two months and 60 days of bank statements. Photos of the documents are fine.","video":null,"hoursAgo":50},{"direction":"inbound","body":"Елена, добрый день! Документы соберу к понедельнику. Один вопрос — если жена не работает, это повлияет на одобрение?","status":"received","preparedByAi":false,"translationEn":"Elena, good afternoon! I'll gather the documents by Monday. One question — if my wife doesn't work, will that affect the approval?","video":null,"hoursAgo":8}]},{"id":"963d9a03-b38d-4d04-80ef-ee19e9e0ed5d","subject":"Letter of explanation","channel":"sms","awaiting_reply":true,"with_name":"Denise Brooks","language":"en","owner":"Minh Nguyen","messages":[{"direction":"outbound","body":"Hi Denise — underwriting asked for a short note explaining the $8,400 deposit on 6/28. A sentence or two is enough. — Minh, Loan Factory","status":"sent","preparedByAi":false,"translationEn":null,"video":null,"hoursAgo":48},{"direction":"inbound","body":"That was the sale of my old car. I'll write it up tonight.","status":"received","preparedByAi":false,"translationEn":null,"video":null,"hoursAgo":46}]},{"id":"da9b58d8-55e9-4bdb-a908-9484e8dc59cd","subject":"Grace Kim — preapproval","channel":"email","awaiting_reply":false,"with_name":"Jenna Alvarez","language":"en","owner":"Minh Nguyen","messages":[{"direction":"inbound","body":"Hi Minh — sending you Grace Kim. She's pre-shopping, wants to know her number before we tour. Be gentle, she's nervous about the whole thing.","status":"received","preparedByAi":false,"translationEn":null,"video":null,"hoursAgo":52},{"direction":"outbound","body":"Got her, thanks Jenna. I'll call today and keep it low-pressure.\n\nMinh","status":"sent","preparedByAi":false,"translationEn":null,"video":null,"hoursAgo":50}]},{"id":"b195e24e-67d2-48e9-bded-b371334666d9","subject":"The last two bank statements","channel":"email","awaiting_reply":true,"with_name":"Bích Trần","language":"vi","owner":"Minh Nguyen","messages":[{"direction":"outbound","body":"Chào chị Bích,\n\nWe're close. To finish the review I still need:\n\n- Your last 2 business bank statements\n- The 2025 profit and loss statement\n\nYou can send them however is easiest.\n\nMinh Nguyen\nNMLS 1856432","status":"sent","preparedByAi":false,"translationEn":null,"video":null,"hoursAgo":96},{"direction":"inbound","body":"Anh Minh, tôi sẽ gửi tuần này. Tiệm đang bận quá.","status":"received","preparedByAi":false,"translationEn":null,"video":null,"hoursAgo":70}]},{"id":"faf3ef4a-3d1f-459e-b9b9-76e915d7c842","subject":"Congratulations on your new home","channel":"email","awaiting_reply":false,"with_name":"Erin Gallagher","language":"en","owner":"Minh Nguyen","messages":[{"direction":"outbound","body":"Erin — congratulations. Your loan funded and the home is officially yours.\n\nIt was a pleasure working with you and Dan. If anything comes up, you know where to find me.\n\nMinh Nguyen\nNMLS 1856432\nCompany NMLS 320841\n\nEqual Housing Opportunity.","status":"sent","preparedByAi":false,"translationEn":null,"video":null,"hoursAgo":90}]},{"id":"7962de1c-3756-409a-97be-952bf826b587","subject":"Still looking?","channel":"call","awaiting_reply":false,"with_name":"Diego Alvarez","language":"es","owner":"Minh Nguyen","messages":[{"direction":"outbound","body":"Called to check on the house search. No answer — left a voicemail.","status":"sent","preparedByAi":false,"translationEn":null,"video":null,"hoursAgo":216}]}],"approvals":[{"id":"2bce9255-c501-429c-b8a3-2b2b3079aa48","kind":"draft_email","title":"Реактивация: Виктор Лебедев — год после закрытия","body":"Здравствуйте, Виктор!\n\nПрошёл год с покупки вашего дома — поздравляю с годовщиной!\n\nРаз в год я предлагаю клиентам короткий разговор: посмотреть, изменилось ли что-то, и стоит ли что-то предпринять. Без обязательств. Удобно ли на следующей неделе?\n\nElena Petrova\nNMLS 1922845\nCompany NMLS 320841\n\nРавные жилищные возможности.","rationale":"His loan funded 12 months ago and the annual-review date arrived. Preferred language is Russian; a human translation review is required before sending.","factors":["Annual review date reached","Funded 12 months ago","Preferred language: Russian"],"language":"ru","template_ref":null,"person":"Elena Sokolova","for_lo":"Elena Petrova"},{"id":"de768acf-e3df-4d57-902f-add355e3c629","kind":"draft_email","title":"Nhắc anh Hùng Trần — giấy tờ còn thiếu","body":"Chào anh Hùng,\n\nEm nhắc nhẹ: hồ sơ còn thiếu sao kê ngân hàng tháng vừa rồi và giấy xác nhận việc làm.\n\nKhi nào anh gửi được, em xem ngay và báo bước tiếp theo.\n\nThúy Phạm\nNMLS 1901288\nCompany NMLS 320841\n\nCơ hội Nhà ở Bình đẳng.","rationale":"File has waited on borrower items for 4 days. His preferred language is Vietnamese; a human translation review is required before sending.","factors":["Docs-needed flag open 4 days","Preferred language: Vietnamese","No reminder sent yet"],"language":"vi","template_ref":null,"person":"Chi Hoàng","for_lo":"Thúy Phạm"},{"id":"23780f91-691e-40bb-b9de-8c383f9b1764","kind":"draft_email","title":"Seguimiento a María García — documentos pendientes","body":"Hola María,\n\nSolo un recordatorio amable: todavía esperamos sus talones de pago y los estados de cuenta para completar la preaprobación.\n\nCuando los tenga, respóndame a este correo y yo me encargo del resto.\n\nCarlos Mendoza\nNMLS 1764201\nCompany NMLS 320841\n\nIgualdad de Oportunidades en la Vivienda.","rationale":"Documents were requested 5 days ago with no reply. Her preferred language is Spanish. English translation shown to you; the Spanish text is what would send.","factors":["Docs requested 5 days ago","No reply since","Preferred language: Spanish"],"language":"es","template_ref":null,"person":"Lucía Gómez","for_lo":"Carlos Mendoza"},{"id":"ba40b606-d435-492f-bca3-97521803c413","kind":"next_best_action","title":"Diego Alvarez has gone quiet — 9 days with no movement","body":null,"rationale":"Preapproved at $430K five weeks ago and searching, but there's been no activity for 9 days and his preapproval expires in about a month.","factors":["No activity 9 days (QUALIFY threshold is 7)","Preapproval expires in 34 days","No offer submitted since preapproval"],"language":"en","template_ref":null,"person":"Diego Alvarez","for_lo":"Minh Nguyen"},{"id":"a49e5390-1a9a-407b-94f8-f3f5c56e9b23","kind":"draft_email","title":"Annual review outreach — Paul Whitmore","body":"Hi Paul,\n\nIt's been a year since you closed on the Magnolia house — congratulations on the anniversary.\n\nI set aside time each year to look at my clients' mortgages and check whether anything has changed worth acting on. No agenda, and no cost. Would a 15-minute call in the next week or two be useful?\n\nMinh Nguyen\nNMLS 1856432\nCompany NMLS 320841\n\nEqual Housing Opportunity.","rationale":"His loan closed 358 days ago and his annual review date has arrived. No contact in 96 days.","factors":["Annual review date reached","Funded 358 days ago","No contact 96 days"],"language":"en","template_ref":"EMT-108","person":"Paul Whitmore","for_lo":"Minh Nguyen"},{"id":"5b214309-92ff-4d96-827a-59e2b23f3fd9","kind":"next_best_action","title":"Call Chidi Okonkwo — rate alert lead, no contact for 26 hours","body":null,"rationale":"He set a rate alert through the QM Pricer 26 hours ago and nobody has called. Leads contacted within an hour convert several times more often than leads contacted the next day.","factors":["Captured 26 hours ago via QM Pricer","Zero contact attempts","Speed-to-lead SLA breached"],"language":"en","template_ref":null,"person":"Chidi Okonkwo","for_lo":"Minh Nguyen"},{"id":"9852f121-ef10-44f0-8252-da4aedd734e7","kind":"draft_email","title":"Reply /* ======================= helpers ======================= */
const NOW = new Date(DATA.generatedAt || Date.now());
const $ = (sel, el) => (el || document).querySelector(sel);
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function moneyCompact(n){
  n = Number(n || 0);
  if (n >= 1e6){ const v = (n/1e6).toFixed(1); return "$" + (v.endsWith(".0") ? v.slice(0,-2) : v) + "M"; }
  if (n >= 1e3) return "$" + Math.round(n/1e3) + "K";
  return "$" + Math.round(n);
}
function money(n){ return "$" + Number(n||0).toLocaleString("en-US"); }
function daysUntil(dateStr){
  if (!dateStr) return null;
  const d = new Date(dateStr + "T12:00:00");
  return Math.round((d - NOW) / 86400000);
}
function mmss(seconds){
  if (seconds == null) return "—";
  const m = Math.floor(seconds/60), s = Math.round(seconds%60);
  return m + ":" + String(s).padStart(2,"0");
}
function durLabel(sec){ return mmss(sec); }
function initials(name){
  return String(name||"").split(/\s+/).map(w => w[0] || "").join("").slice(0,2).toUpperCase();
}
const LANG_NAMES = { en:"English", es:"Spanish", vi:"Vietnamese", ru:"Russian", zh:"Chinese" };
function langBadge(lang){
  if (!lang || lang === "en") return "";
  return '<span class="lang-badge">' + esc(String(lang).toUpperCase()) + '</span>';
}
function personName(p){ return ((p.first_name||"") + " " + (p.last_name||"")).trim(); }

/* Urgency for an active file. Returns {tone,label,score} or null. */
function urgencyOf(p){
  const lock = daysUntil(p.rate_lock_expires_at);
  if (lock != null && lock >= 0 && lock <= 3)
    return { tone:"crit", label:"Lock expires in " + lock + "d", score: lock };
  const close = daysUntil(p.closing_date);
  if (close != null && close >= 0 && close <= 5)
    return { tone:"crit", label:"Closes in " + close + "d", score: 10 + close };
  const phase = PHASE_OF[p.stage] || "ENGAGE";
  if ((p.idle_days || 0) > stallDays(phase))
    return { tone:"warn", label:"No movement " + p.idle_days + "d", score: 100 - Math.min(p.idle_days,60) };
  return null;
}

/* ---- assistant (client-side, dataset-only) ---- */
const PREVIEW_NOTE = "Preview mode: no AI model is connected — answers come from the demo dataset.";
function assistantAnswer(q){
  const t = q.toLowerCase();
  let body;
  if (/(focus|priorit|first|start|do today|today\?)/.test(t)) body = ansFocus();
  else if (/(quiet|stall|idle|no movement|silent|cold)/.test(t)) body = ansQuiet();
  else if (/(pipeline|summar|volume|phase|files)/.test(t)) body = ansPipeline();
  else if (/(draft|approval|approve|waiting|queue)/.test(t)) body = ansDrafts();
  else if (/(clos|fund|lock|settle)/.test(t)) body = ansClosings();
  else body = "I can answer from the demo dataset: what to focus on, who has gone quiet, a pipeline summary, waiting drafts, or upcoming closings. Try one of the suggested prompts.";
  return body + "\n\n" + PREVIEW_NOTE;
}
function ansFocus(){
  const st = DATA.stats;
  const locks = activeLoans()
    .map(p => ({ p, d: daysUntil(p.rate_lock_expires_at) }))
    .filter(x => x.d != null && x.d >= 0 && x.d <= 3)
    .sort((a,b) => a.d - b.d);
  const lines = ["Three things first:"];
  lines.push("1. Review the " + pendingApprovals().length + " AI drafts waiting for approval — three are in a language that needs a human translation check.");
  if (locks.length) lines.push("2. " + personName(locks[0].p) + "'s rate lock expires in " + locks[0].d + " day" + (locks[0].d === 1 ? "" : "s") + (locks.length > 1 ? " (and " + (locks.length - 1) + " more locks are inside 3 days)" : "") + ".");
  else lines.push("2. " + st.closing_7d + " files close within 7 days — confirm docs are in.");
  lines.push("3. " + st.waiting_leads + " leads are still waiting on a first reply, and " + st.overdue_tasks + " tasks are overdue across the team.");
  return lines.join("\n");
}
function ansQuiet(){
  const quiet = activeLoans()
    .filter(p => (p.idle_days || 0) > stallDays(PHASE_OF[p.stage] || "ENGAGE"))
    .sort((a,b) => (b.idle_days||0) - (a.idle_days||0)).slice(0,5);
  if (!quiet.length) return "No active file has crossed its movement threshold. Nice.";
  const lines = ["These active files have gone quiet the longest:"];
  quiet.forEach(p => lines.push("• " + personName(p) + " — " + stageLabel(p.stage) + ", no movement " + p.idle_days + "d (owner " + p.owner + ")"));
  const qp = DATA.partners.filter(pt => pt.tier === "quiet").length;
  if (qp) lines.push("Also: " + qp + " referral partners are in the Quiet tier — worth a touch this week.");
  return lines.join("\n");
}
function ansPipeline(){
  const act = activeLoans();
  const lines = ["Pipeline right now — " + act.length + " active files, " + moneyCompact(act.reduce((s,p)=>s+Number(p.amount||0),0)) + " total:"];
  MACRO_PHASES.forEach(ph => {
    const rows = act.filter(p => PHASE_OF[p.stage] === ph);
    if (rows.length) lines.push("• " + ph + ": " + rows.length + " files, " + moneyCompact(rows.reduce((s,p)=>s+Number(p.amount||0),0)));
  });
  lines.push("Funded this month: " + moneyCompact(DATA.stats.funded_mtd) + ".");
  return lines.join("\n");
}
function ansDrafts(){
  const pend = pendingApprovals();
  if (!pend.length) return "The approval queue is clear.";
  const lines = [pend.length + " AI drafts are waiting on Today:"];
  pend.forEach(a => lines.push("• " + a.title + (a.language && a.language !== "en" ? " (" + (LANG_NAMES[a.language] || a.language) + ")" : "")));
  return lines.join("\n");
}
function ansClosings(){
  const soon = activeLoans()
    .map(p => ({ p, d: daysUntil(p.closing_date) }))
    .filter(x => x.d != null && x.d >= 0 && x.d <= 14)
    .sort((a,b) => a.d - b.d);
  if (!soon.length) return "No closings inside the next two weeks.";
  const lines = [soon.length + " file" + (soon.length === 1 ? " closes" : "s close") + " within 14 days:"];
  soon.slice(0,8).forEach(x => lines.push("• " + personName(x.p) + " — " + moneyCompact(x.p.amount) + ", closes in " + x.d + "d" + (x.d <= 5 ? " ⚠" : "") + " (owner " + x.p.owner + ")"));
  return lines.join("\n");
}
function askAssistant(q){
  q = (q || "").trim();
  if (!q) return;
  S.chat.push({ role:"user", text:q });
  S.chat.push({ role:"assistant", text: assistantAnswer(q) });
  const thread = $("#ai-thread");
  if (thread){
    thread.innerHTML = '<div class="msg-row assistant" style="margin-top:0"><span class="ai-mark">AI</span>' +
      '<div style="min-width:0;flex:1">' + briefingHtml() + '</div></div>' + chatThreadHtml();
    thread.scrollTop = thread.scrollHeight;
  }
}

  html += '<div class="kanban">';
  MACRO_PHASES.forEach(ph => {
    const phaseRows = act.filter(p => PHASE_OF[p.stage] === ph);
    const vol = phaseRows.reduce((s,p)=>s+Number(p.amount||0),0);
    html += '<section class="kcol"><header class="kcol-head"><h3>' + ph +
      '<span class="muted tnum" style="font-weight:400;margin-left:6px">' + phaseRows.length + '</span></h3>' +
      (vol ? '<span class="small muted tnum">' + moneyCompact(vol) + '</span>' : "") + '</header>' +
      '<div class="kcol-body">';
    let any = false;
    STAGES.filter(s => PHASE_OF[s] === ph).forEach(st => {
      const rows = phaseRows.filter(p => p.stage === st);
      if (!rows.length) return;
      any = true;
      html += '<div><div class="kstage-lb"><span>' + esc(stageLabel(st)) + '</span><span class="micro muted tnum">' + rows.length + '</span></div>' +
        rows.map(loanCardHtml).join("") + '</div>';
    });
    if (!any) html += '<p class="empty small" style="padding:24px 8px">Nothing in ' + ph.toLowerCase() + '</p>';
    html += '</div></section>';
  });
  html += '</div>';
  return html;
}

      chartCard("Language mix (people)", barChart(DATA.languageMix.map(l => ({
        label: LANG_NAMES[l.lang] || l.lang, v: l.n, text: l.n + " · " + Math.round((l.n/langTotal)*100) + "%", cls:"ai" })))) +
      chartCard("Active files, by loan officer", barChart(los.map(t => ({
        label: t.full_name, v: t.active_files || 0, text: (t.active_files||0) + " · " + moneyCompact(t.active_volume) })))) +
      chartCard("Leads waiting on a first reply", barChart(los.slice().sort((a,b)=>(b.waiting_leads||0)-(a.waiting_leads||0)).map(t => ({
        label: t.full_name, v: t.waiting_leads || 0, cls:"dim" })))) +
    '</div>' +
  '</div>';
}

/* ======================= Team ======================= */
const ROLE_LABELS = { lo:"Loan officer", team_leader:"Team leader", admin:"Admin", processor:"Processor", lo_assistant:"LO assistant" };
function teamDetailHtml(t){
  if (!t) return '<div class="card"><div class="empty">Select a teammate to see their queue summary.</div></div>';
  const theirFiles = activeLoans().filter(p => p.owner === t.full_name);
  const urgent = theirFiles.map(p => ({ p, u: urgencyOf(p) })).filter(x => x.u)
    .sort((a,b) => a.u.score - b.u.score).slice(0,5);
  const theirApprovals = DATA.approvals.filter(a => a.for_lo === t.full_name && S.approvals[a.id] === "pending");
  return '<div class="card" style="padding:16px 18px">' +
    '<div style="display:flex;gap:10px;align-items:center"><div class="avatar">' + esc(initials(t.full_name)) + '</div>' +
      '<div><p style="font-weight:600">' + esc(t.full_name) + '</p>' +
      '<p class="small muted">' + esc(ROLE_LABELS[t.role] || t.role) + (t.nmls_id ? ' · NMLS ' + esc(t.nmls_id) : "") +
      (t.language && t.language !== "en" ? ' · speaks ' + esc(LANG_NAMES[t.language] || t.language) : "") + '</p></div></div>' +
    '<div class="stat-grid" style="margin-top:12px">' +
      [["Active files", t.active_files || 0],["Volume", moneyCompact(t.active_volume)],["Funded (all time)", t.funded_total || 0],
       ["Waiting leads", t.waiting_leads || 0],["Overdue tasks", t.overdue_tasks || 0],["Median first reply", mmss(t.median_response_seconds)]]
        .map(([l,v]) => '<div class="stat" style="padding:9px 12px"><p class="lb">' + l + '</p><p class="vl tnum" style="font-size:1.0625rem">' + v + '</p></div>').join("") +
    '</div>' +
    (theirApprovals.length ? '<p class="small" style="margin-top:12px"><span class="badge b-ai">' + theirApprovals.length +
      ' AI draft' + (theirApprovals.length === 1 ? "" : "s") + ' waiting</span></p>' : "") +
    '<h4 class="section-title" style="margin-top:14px">Needs attention in their queue</h4>' +
    (urgent.length ? urgent.map(x =>
      '<div class="briefing-b"><span class="small"><strong>' + esc(personName(x.p)) + '</strong> — ' + esc(stageLabel(x.p.stage)) +
      ' · <span style="color:var(--' + (x.u.tone === "crit" ? "critical" : "warning") + '-fg);font-weight:600">' + esc(x.u.label) + '</span></span></div>').join("")
      : '<p class="small muted">Nothing urgent in their queue right now.</p>') +
    '<p class="micro muted" style="margin-top:12px">Demo data.</p>' +
  '</div>';
}
function teamScreen(){
  const members = DATA.team.slice().sort((a,b) => (b.active_files||0) - (a.active_files||0));
  const maxFiles = Math.max.apply(null, members.map(t => t.active_files || 0).concat([1]));
  const sel = DATA.team.find(t => t.id === S.team.sel) || null;
  return '<div style="padding:0 24px"><div class="page-head" style="padding-left:0;padding-right:0"><h2>Team</h2>' +
    '<p>The whole roster and where the load sits. Demo data.</p></div></div>' +
    '<div class="team-split" style="padding-top:0">' +
    '<div class="card" style="flex:1;min-width:0;overflow-x:auto"><table class="tbl"><thead><tr>' +
      '<th>Teammate</th><th>Active files</th><th>Share</th><th>Volume</th><th>Tasks (overdue)</th><th>Waiting leads</th><th>First reply</th><th>Approvals</th></tr></thead><tbody>' +
      members.map(t =>
        '<tr class="rowlink" data-action="team-select" data-id="' + esc(t.id) + '">' +
        '<td><strong>' + esc(t.full_name) + '</strong>' + (t.language && t.language !== "en" ? " " + langBadge(t.language) : "") +
          '<div class="micro muted">' + esc(ROLE_LABELS[t.role] || t.role) + '</div></td>' +
        '<td class="tnum">' + (t.active_files || 0) + '</td>' +
        '<td><span class="share-bar"><i style="width:' + Math.round(((t.active_files||0)/maxFiles)*100) + '%"></i></span></td>' +
        '<td class="tnum">' + moneyCompact(t.active_volume) + '</td>' +
        '<td class="tnum">' + (t.open_tasks || 0) + (t.overdue_tasks ? ' <span style="color:var(--critical-fg);font-weight:600">(' + t.overdue_tasks + ')</span>' : " (0)") + '</td>' +
        '<td class="tnum">' + (t.waiting_leads || 0) + '</td>' +
        '<td class="tnum">' + mmss(t.median_response_seconds) + '</td>' +
        '<td class="tnum">' + (t.pending_approvals || 0) + '</td></tr>').join("") +
    '</tbody></table></div>' +
    '<div style="width:360px;flex-shrink:0" id="team-detail">' + teamDetailHtml(sel) + '</div>' +
  '</div>';
}

/* ======================= How To Videos ======================= */
function videosScreen(){
  const cats = ["all"].concat(Array.from(new Set(DATA.videos.map(v => v.category))));
  const rows = DATA.videos.filter(v => S.videos.cat === "all" || v.category === S.videos.cat);

    '<div class="page-head" style="padding-left:0;padding-right:0"><h2>How To Videos</h2><p>Short walkthroughs of every corner of the CRM.</p></div>' +
    '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">' + cats.map(c =>
      '<button type="button" class="chip' + (S.videos.cat === c ? " on" : "") + '" data-action="videos-cat" data-cat="' + esc(c) + '">' +
      (c === "all" ? "All" : esc(c)) + '</button>').join("") + '</div>' +
    '<div class="cards-grid">' + rows.map(v =>
      '<div class="vid-card"><div class="ph"><span class="play"></span>' +
        '<span class="dur tnum" style="position:absolute;right:8px;bottom:8px;background:rgba(5,7,8,.7);color:#fff;font-size:.6875rem;font-weight:600;border-radius:4px;padding:1px 5px">' +
        durLabel(v.duration_seconds) + '</span></div>' +
      '<div style="padding:12px 14px">' +
        '<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">' +
          (v.featured ? '<span class="badge b-action">Featured</span>' : "") +
          '<span class="badge b-warning">Video coming soon</span></div>' +
        '<p style="font-weight:600;margin-top:8px">' + esc(v.title) + '</p>' +
        '<p class="small sec" style="margin-top:2px">' + esc(v.description || "") + '</p>' +
        '<p class="micro muted" style="margin-top:6px">' + esc(v.category) + '</p>' +
        '<button type="button" class="btn btn-ghost btn-sm" style="margin-top:10px" disabled>Watch</button>' +
      '</div></div>').join("") + '</div>' +
  '</div>';
}

/* ======================= Compose (video message) ======================= */
const STARTERS = {
  en: "Hi — I recorded a short video for you. Three minutes, no obligation, and you can watch it whenever suits.",
  es: "Hola: le grabé un video corto. Son tres minutos, sin ningún compromiso, y puede verlo cuando le convenga.",
  vi: "Chào anh/chị — tôi vừa ghi một video ngắn dành cho anh/chị. Chỉ ba phút, không ràng buộc gì, xem lúc nào tiện cũng được.",
  ru: "Здравствуйте! Я записала для вас короткое видео — всего три минуты, без каких-либо обязательств. Посмотрите, когда будет удобно."
};
const CLOSERS = {
  en: "If anything in there raises a question, just reply — happy to talk it through.",
  es: "Si algo le genera dudas, respóndame y lo conversamos con gusto.",
  vi: "Nếu có điều gì cần hỏi thêm, anh/chị cứ nhắn lại — tôi rất sẵn lòng trao đổi.",
  ru: "Если появятся вопросы — просто ответьте на это письмо, с удовольствием всё обсудим."
};
function composeVideoBlock(){
  const c = S.compose;
  let inner = "";
  if (c.videoUrl){
    inner += '<video class="preview-video" controls src="' + c.videoUrl + '"></video>' +
      '<div class="video-meta" style="border:1px solid var(--border-subtle);border-radius:8px;margin-top:8px">' +
        '<p class="t">' + esc(c.videoTitle || "Video message") + '</p>' +
        '<p class="c">' + (c.videoDuration != null ? durLabel(c.videoDuration) + " · " : "") +
          esc(c.videoSource === "recorded" ? "Recorded just now" : "Uploaded from disk") + '</p></div>';
  } else if (c.recording){
    inner += '<video class="preview-video" id="live-preview" autoplay muted playsinline></video>' +
      '<button type="button" class="btn btn-primary" style="margin-top:10px" data-action="stop-record">Stop recording</button>';
  } else {
    inner += '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">' +
      '<button type="button" class="btn btn-ghost" data-action="record-video">Record video</button>' +
      '<label class="btn btn-ghost" style="cursor:pointer">Upload a video file' +
        '<input type="file" accept="video/*" id="video-file" style="display:none"></label></div>';
    if (c.cameraError) inner += '<div class="note-box">' + esc(c.cameraError) + '</div>';
  }
  return inner;
}
function composeScreen(){
  const c = S.compose;
  return '<div class="wrap" style="max-width:44rem">' +
    '<div class="page-head" style="padding-left:0;padding-right:0"><h2>Compose video message</h2>' +
      '<p>A short personal video beats a long email. Drafts land in Conversations for review.</p></div>' +
    '<div class="card" style="padding:18px 20px">' +
      '<div class="form-row" style="margin-top:0"><label for="cmp-to">To</label>' +
        '<input class="input" id="cmp-to" placeholder="Who is this for? e.g. Mai Phạm" value="' + esc(c.to || "") + '"></div>' +
      '<div class="form-row"><label for="cmp-lang">Language</label>' +
        '<select class="input" id="cmp-lang" data-action="compose-lang">' +
          [["en","English"],["es","Spanish"],["vi","Vietnamese"],["ru","Russian"]].map(([k,l]) =>
            '<option value="' + k + '"' + (c.lang === k ? " selected" : "") + '>' + l + '</option>').join("") +
        '</select></div>' +
      '<div class="form-row"><label for="cmp-subject">Subject</label>' +
        '<input class="input" id="cmp-subject" placeholder="A quick video for you" value="' + esc(c.subject || "") + '"></div>' +
      '<div class="form-row"><label for="cmp-intro">Intro</label>' +
        '<textarea class="input" id="cmp-intro" rows="3">' + esc(c.intro != null ? c.intro : STARTERS[c.lang]) + '</textarea></div>' +
      '<div class="form-row"><label>Video</label><div id="video-block">' + composeVideoBlock() + '</div></div>' +
      '<div class="form-row"><label for="cmp-closing">Closing</label>' +
        '<textarea class="input" id="cmp-closing" rows="2">' + esc(c.closing != null ? c.closing : CLOSERS[c.lang]) + '</textarea></div>' +
      '<div style="display:flex;gap:8px;margin-top:18px">' +
        '<button type="button" class="btn btn-primary" data-action="save-draft">Save draft</button>' +
        '<a class="btn btn-ghost" href="#/marketing">Cancel</a></div>' +
      '<p class="micro muted" style="margin-top:10px">Drafts stay in this demo session only — nothing is sent, and nothing leaves this file.</p>' +
    '</div>' +
  '</div>';
}
let mediaStream = null, mediaRecorder = null, recChunks = [], recStartedAt = 0;
function syncComposeFields(){
  const c = S.compose;
  const to = $("#cmp-to"), sub = $("#cmp-subject"), intro = $("#cmp-intro"), close = $("#cmp-closing");
  if (to) c.to = to.value;
  if (sub) c.subject = sub.value;
  if (intro) c.intro = intro.value;
  if (close) c.closing = close.value;
}
function startRecording(){
  const md = navigator.mediaDevices;
  const honest = "Camera access is unavailable when this file opens directly from disk — upload a video file instead.";
  if (!md || !md.getUserMedia || typeof MediaRecorder === "undefined"){
    S.compose.cameraError = honest;
    $("#video-block").innerHTML = composeVideoBlock();
    return;
  }
  md.getUserMedia({ video:true, audio:true }).then(stream => {
    mediaStream = stream;
    S.compose.recording = true;
    S.compose.cameraError = null;
    $("#video-block").innerHTML = composeVideoBlock();
    const live = $("#live-preview");
    if (live) live.srcObject = stream;
    recChunks = [];
    recStartedAt = Date.now();
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e => { if (e.data && e.data.size) recChunks.push(e.data); };
    mediaRecorder.onstop = () => {
      const blob = new Blob(recChunks, { type: mediaRecorder.mimeType || "video/webm" });
      stream.getTracks().forEach(t => t.stop());
      mediaStream = null;
      S.compose.recording = false;
      if (!blob.size){
        S.compose.cameraError = "Nothing was captured — upload a video file instead.";
      } else {
        S.compose.videoUrl = URL.createObjectURL(blob);
        S.compose.videoSource = "recorded";
        S.compose.videoTitle = ($("#cmp-subject") && $("#cmp-subject").value) || "Video message";
        S.compose.videoDuration = Math.round((Date.now() - recStartedAt) / 1000);
      }
      $("#video-block").innerHTML = composeVideoBlock();
    };
    mediaRecorder.start();
  }).catch(() => {
    S.compose.recording = false;
    S.compose.cameraError = honest;
    $("#video-block").innerHTML = composeVideoBlock();
  });
}
function stopRecording(){
  if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
  else if (mediaStream){ mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
}
function handleVideoFile(file){
  if (!file) return;
  S.compose.videoUrl = URL.createObjectURL(file);
  S.compose.videoSource = "uploaded";
  S.compose.videoTitle = file.name.replace(/\.[^.]+$/, "");
  S.compose.videoDuration = null;
  $("#video-block").innerHTML = composeVideoBlock();
  const v = $("#video-block video");
  if (v) v.addEventListener("loadedmetadata", () => {
    if (isFinite(v.duration)){
      S.compose.videoDuration = Math.round(v.duration);
      const meta = $("#video-block .video-meta .c");
      if (meta) meta.textContent = durLabel(S.compose.videoDuration) + " · Uploaded from disk";
    }
  });
}
function saveDraft(){
  syncComposeFields();
  const c = S.compose;
  const langLine = c.lang !== "en" ? " (" + (LANG_NAMES[c.lang] || c.lang) + ")" : "";
  const id = "demo-draft-" + Date.now();
  const body = (c.intro || STARTERS[c.lang]) + "\n\n[Video: " + (c.videoTitle || "Video message") + "]\n\n" + (c.closing || CLOSERS[c.lang]);
  DATA.conversations.unshift({
    id, subject: (c.subject || "A quick video for you") + "", channel:"email", awaiting_reply:false,
    with_name: c.to || "New recipient", language: c.lang, owner: (DATA.viewer && DATA.viewer.name) || "",
    messages: [{
      direction:"outbound", body, status:"draft", preparedByAi:false, translationEn:null,
      video: { demo:true, title: c.videoTitle || (c.subject || "Video message"), caption: "Video message" + langLine,
        durationSeconds: c.videoDuration != null ? c.videoDuration : 0 },
      hoursAgo: 0
    }]
  });
  S.savedNote = "Draft saved to Conversations — in a live build this would wait for your review before sending.";
  S.compose = { lang:"en", videoTitle:null, videoDuration:null, videoUrl:null, videoSource:null };
  location.hash = "#/conversations/" + id;
}

/* ======================= events ======================= */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const act = el.getAttribute("data-action");
  switch (act){
    case "ask": askAssistant(el.getAttribute("data-q")); break;
    case "approve":
      S.approvals[el.getAttribute("data-id")] = "approved";
      $("#approval-queue").innerHTML = approvalQueueHtml();
      renderSidebar();
      break;
    case "skip":
      S.approvals[el.getAttribute("data-id")] = "skipped";
      $("#approval-queue").innerHTML = approvalQueueHtml();
      renderSidebar();
      break;
    case "pipeline-view": S.pipelineView = el.getAttribute("data-view"); render(); break;
    case "people-tab": S.people.tab = el.getAttribute("data-tab"); render(); $("#people-q") && $("#people-q").focus(); break;
    case "people-lang": {
      const l = el.getAttribute("data-lang");
      const i = S.people.langs.indexOf(l);
      if (i >= 0) S.people.langs.splice(i,1); else S.people.langs.push(l);
      render();
      break;
    }
    case "partners-tab": S.partners.tab = el.getAttribute("data-tab"); render(); break;
    case "team-select":
      S.team.sel = el.getAttribute("data-id");
      $("#team-detail").innerHTML = teamDetailHtml(DATA.team.find(t => t.id === S.team.sel) || null);
      break;
    case "videos-cat": S.videos.cat = el.getAttribute("data-cat"); render(); break;
    case "record-video": syncComposeFields(); startRecording(); break;
    case "stop-record": stopRecording(); break;
    case "save-draft": saveDraft(); break;
  }
});
document.addEventListener("submit", e => {
  const f = e.target.closest("[data-action='ask-form']");
  if (f){
    e.preventDefault();
    const inp = $("#ai-input");
    if (inp && inp.value.trim()){ askAssistant(inp.value); inp.value = ""; }
  }
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.id === "people-q"){ S.people.q = el.value; $("#people-list").innerHTML = peopleRows(); }
  else if (el.id === "tpl-q"){ S.marketing.q = el.value; $("#tpl-list").innerHTML = templateRows(); }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "cmp-lang"){
    syncComposeFields();
    const prevLang = S.compose.lang;
    // Re-seed intro/closing only if the user hasn't diverged from the seeded text.
    if (S.compose.intro === STARTERS[prevLang] || S.compose.intro == null) S.compose.intro = null;
    if (S.compose.closing === CLOSERS[prevLang] || S.compose.closing == null) S.compose.closing = null;
    S.compose.lang = el.value;
    render();
  } else if (el.id === "video-file"){
    syncComposeFields();
    handleVideoFile(el.files && el.files[0]);
  }
});
window.addEventListener("hashchange", () => {
  if (S.savedNote && !/^#\/(marketing|conversations)/.test(location.hash)) S.savedNote = null;
  stopRecording();
  render();
});
render();
</script>
