<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loan Factory CRM — Demonstration Build</title>
<style>
/* ==========================================================================
   Loan Factory CRM — demonstration build.
   Tokens copied from src/app/globals.css (light theme), verbatim.
   AI accents are navy slate — no purple anywhere in this build.
   ========================================================================== */
:root{
  --brand-orange:#f36f28;
  --brand-ink:#050708;
  --action-primary:#c84d0b;
  --action-primary-hover:#ab420a;
  --action-primary-active:#983b08;
  --action-primary-fg:#ffffff;
  --action-tint:#fdf0e8;
  --action-tint-border:#f8d6c2;
  --navy:#0f1826;
  --navy-raised:#16202f;
  --navy-border:#222e40;
  --sidebar:var(--navy);
  --sidebar-fg:#e8ecf2;
  --sidebar-fg-muted:#97a2b2;
  --sidebar-fg-dim:#6b7789;
  --sidebar-hover:#172234;
  --sidebar-active:#1c2b43;
  --sidebar-border:#222e40;
  --canvas:#f5f6f8;
  --surface:#ffffff;
  --raised:#ffffff;
  --sunken:#f0f2f5;
  --border-subtle:#e4e8ed;
  --border-strong:#cfd5dd;
  --text-primary:#131a24;
  --text-secondary:#4e5866;
  --text-muted:#646e7c;
  --text-disabled:#a3abb7;
  --ai-fg:#42546f;
  --ai-bg:#edf1f6;
  --ai-border:#ccd6e2;
  --critical-fg:#b4291d;
  --critical-bg:#fdecea;
  --critical-border:#f6cfca;
  --warning-fg:#8a5a00;
  --warning-bg:#fdf4e3;
  --warning-border:#f3ddb0;
  --healthy-fg:#17724b;
  --healthy-bg:#e7f4ed;
  --healthy-border:#bfe0cf;
  --info-fg:#1d63c4;
  --info-bg:#eaf2fe;
  --info-border:#c6dcfa;
  --neutral-fg:#646e7c;
  --neutral-bg:#f0f2f5;
  --neutral-border:#dfe4ea;
  --shadow-1:0 1px 2px rgb(19 26 36 / .04),0 1px 3px rgb(19 26 36 / .06);
  --shadow-2:0 4px 10px -2px rgb(19 26 36 / .07),0 2px 4px -2px rgb(19 26 36 / .04);
  --shadow-3:0 14px 26px -6px rgb(19 26 36 / .11),0 5px 10px -4px rgb(19 26 36 / .05);
  --radius-card:.75rem;
  --radius-control:.5rem;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:light}
body{
  background:var(--canvas);color:var(--text-primary);
  font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:.875rem;line-height:1.375rem;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  height:100vh;overflow:hidden;
}
.tnum,table{font-variant-numeric:tabular-nums lining-nums}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text-primary)}
a{color:inherit;text-decoration:none}
*:focus-visible{outline:2px solid var(--brand-orange);outline-offset:2px;border-radius:3px}
::selection{background:rgba(243,111,40,.24)}

/* ---- shell -------------------------------------------------------------- */
.app{display:flex;height:100vh}
#sidebar{width:236px;flex-shrink:0;background:var(--sidebar);color:var(--sidebar-fg-muted);display:flex;flex-direction:column}
.sb-logo{display:flex;align-items:center;height:64px;padding:0 28px 0 20px}
.sb-logo img{display:block;width:100%;max-width:172px;height:auto}
.sb-nav{flex:1;padding:4px 12px 12px;overflow-y:auto}
.sb-hr{border:0;border-top:1px solid var(--sidebar-border);margin:8px 8px}
.navitem{position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:10px 12px 10px 14px;border-radius:var(--radius-control);color:var(--sidebar-fg-muted);
  font-size:.75rem;line-height:1rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;transition:background .12s,color .12s}
.navitem:hover{background:var(--sidebar-hover);color:var(--sidebar-fg)}
.navitem.active{background:var(--sidebar-active);color:var(--sidebar-fg)}
.navitem.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:99px;background:var(--brand-orange)}
.navitem svg{width:18px;height:18px;flex-shrink:0;stroke:currentColor}
.navitem.active svg{stroke:var(--brand-orange)}
.nav-count{margin-left:auto;background:var(--brand-orange);color:#fff;border-radius:99px;padding:1px 6px;font-size:.6875rem;font-weight:600}
.sb-foot{border-top:1px solid var(--sidebar-border);padding:14px 24px;font-size:.6875rem;line-height:1rem;color:var(--sidebar-fg-dim)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{height:56px;flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--border-subtle);
  display:flex;align-items:center;gap:12px;padding:0 20px}
#topbar h1{font-size:1.0625rem;line-height:1.5rem;font-weight:600;letter-spacing:-.01em}
.demo-chip{display:inline-flex;align-items:center;gap:6px;background:var(--warning-bg);border:1px solid var(--warning-border);
  color:var(--warning-fg);border-radius:99px;padding:2px 10px;font-size:.75rem;font-weight:600;white-space:nowrap}
.demo-chip::before{content:"";width:7px;height:7px;border-radius:99px;background:var(--warning-fg)}
.topbar-user{margin-left:auto;text-align:right}
.topbar-user .nm{font-size:.8125rem;font-weight:600}
.topbar-user .rl{font-size:.6875rem;color:var(--text-muted)}
.avatar{width:32px;height:32px;border-radius:99px;background:var(--action-tint);border:1px solid var(--action-tint-border);
  color:var(--action-primary);display:grid;place-items:center;font-size:.75rem;font-weight:700}
#view{flex:1;overflow:auto;background:var(--canvas)}
#demofooter{flex-shrink:0;background:var(--navy);border-top:1px solid var(--navy-border);color:var(--sidebar-fg-muted);
  text-align:center;font-size:.75rem;padding:7px 12px;letter-spacing:.02em}

/* ---- primitives --------------------------------------------------------- */
.wrap{max-width:64rem;margin:0 auto;padding:16px 24px 32px}
.wrap-wide{max-width:none;padding:16px 24px 32px}
.card{background:var(--surface);border:1px solid var(--border-subtle);border-radius:var(--radius-card);box-shadow:var(--shadow-1)}
.page-head{padding:20px 24px 14px}
.page-head h2{font-size:1.375rem;line-height:1.875rem;font-weight:600;letter-spacing:-.01em}
.page-head p{color:var(--text-secondary);margin-top:2px}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:6px;border:1px solid;padding:1px 7px;font-size:.75rem;font-weight:600;white-space:nowrap}
.b-neutral{background:var(--neutral-bg);border-color:var(--neutral-border);color:var(--neutral-fg)}
.b-healthy{background:var(--healthy-bg);border-color:var(--healthy-border);color:var(--healthy-fg)}
.b-warning{background:var(--warning-bg);border-color:var(--warning-border);color:var(--warning-fg)}
.b-critical{background:var(--critical-bg);border-color:var(--critical-border);color:var(--critical-fg)}
.b-info{background:var(--info-bg);border-color:var(--info-border);color:var(--info-fg)}
.b-ai{background:var(--ai-bg);border-color:var(--ai-border);color:var(--ai-fg)}
.b-action{background:var(--action-tint);border-color:var(--action-tint-border);color:var(--action-primary)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border-radius:var(--radius-control);
  font-size:.875rem;font-weight:600;transition:background .12s,border-color .12s}
.btn-primary{background:var(--action-primary);color:var(--action-primary-fg);box-shadow:var(--shadow-1)}
.btn-primary:hover{background:var(--action-primary-hover)}
.btn-ghost{border:1px solid var(--border-strong);background:var(--surface);color:var(--text-primary)}
.btn-ghost:hover{background:var(--sunken)}
.btn[disabled]{opacity:.45;cursor:not-allowed;pointer-events:none}
.btn-sm{height:28px;padding:0 10px;font-size:.8125rem}
.input,select.input,textarea.input{height:38px;border:1px solid var(--border-strong);background:var(--surface);
  border-radius:var(--radius-control);padding:0 12px;font-size:.875rem;width:100%}
textarea.input{height:auto;padding:8px 12px;resize:vertical}
.input::placeholder{color:var(--text-muted)}
.input:focus{outline:none;border-color:var(--brand-orange)}
select.input-sm{height:30px;font-size:.8125rem;padding:0 8px;width:auto;border:1px solid var(--border-strong);
  background:var(--surface);border-radius:6px;color:var(--text-secondary)}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:var(--border-subtle);
  border:1px solid var(--border-subtle);border-radius:var(--radius-card);overflow:hidden}
.stat{background:var(--surface);padding:12px 16px}
.stat .lb{font-size:.75rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted)}
.stat .vl{font-size:1.3125rem;line-height:1.75rem;font-weight:600;margin-top:4px}
.stat .mt{font-size:.8125rem;color:var(--text-muted)}
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--border-subtle);padding:0 4px}
.tab{padding:8px 12px;font-size:.875rem;font-weight:600;color:var(--text-secondary);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--text-primary)}
.tab.on{color:var(--action-primary);border-bottom-color:var(--brand-orange)}
.tab .ct{font-weight:400;color:var(--text-muted);margin-left:4px}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:99px;border:1px solid var(--border-strong);background:var(--surface);
  padding:3px 11px;font-size:.8125rem;color:var(--text-secondary);transition:border-color .12s,color .12s}
.chip:hover{border-color:var(--brand-orange);color:var(--action-primary)}
.chip.on{background:var(--action-tint);border-color:var(--action-tint-border);color:var(--action-primary);font-weight:600}
.chip-ai{border-color:var(--ai-border)}
.chip-ai:hover,.chip-ai.on{border-color:var(--ai-fg);color:var(--ai-fg);background:var(--surface)}
.seg{display:inline-flex;border:1px solid var(--border-subtle);border-radius:6px;padding:2px;background:var(--surface);gap:2px}
.seg .btn{border-radius:4px}
table.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:.75rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted);
  text-align:left;padding:9px 14px;border-bottom:1px solid var(--border-subtle);white-space:nowrap}
.tbl td{padding:10px 14px;border-bottom:1px solid var(--border-subtle);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr.rowlink{cursor:pointer}
.tbl tr.rowlink:hover td{background:var(--sunken)}
.muted{color:var(--text-muted)}.sec{color:var(--text-secondary)}
.small{font-size:.8125rem;line-height:1.25rem}
.micro{font-size:.6875rem;line-height:.875rem}
.lang-badge{display:inline-flex;border-radius:5px;border:1px solid var(--info-border);background:var(--info-bg);color:var(--info-fg);
  padding:0 5px;font-size:.6875rem;font-weight:700;letter-spacing:.04em}
.section-title{font-size:.9375rem;line-height:1.375rem;font-weight:600;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.bar-row{display:grid;grid-template-columns:150px 1fr 84px;gap:10px;align-items:center;padding:4px 0}
.bar-track{height:10px;background:var(--sunken);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;border-radius:99px;background:var(--brand-orange)}
.bar-fill.dim{background:var(--border-strong)}
.bar-fill.crit{background:var(--critical-fg)}
.bar-fill.ai{background:var(--ai-fg)}
.empty{padding:44px 24px;text-align:center;color:var(--text-secondary)}
details.why summary{cursor:pointer;font-size:.8125rem;font-weight:600;color:var(--ai-fg);list-style:none}
details.why summary::before{content:"\25B8 "}
details.why[open] summary::before{content:"\25BE "}
details.why .body{margin-top:6px}
.note-box{border:1px solid var(--warning-border);background:var(--warning-bg);color:var(--warning-fg);border-radius:var(--radius-control);
  padding:9px 12px;font-size:.8125rem;margin-top:10px}
.appr-note{border:1px solid var(--healthy-border);background:var(--healthy-bg);color:var(--healthy-fg);border-radius:var(--radius-card);
  padding:9px 14px;margin-top:10px;font-size:.8125rem;font-weight:600}

/* ---- today / assistant -------------------------------------------------- */
.ai-panel{border:1px solid var(--ai-border);background:rgba(237,241,246,.45);border-radius:var(--radius-card);overflow:hidden}
.ai-head{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--ai-border);padding:12px 16px}
.ai-head h2{font-size:1.0625rem;font-weight:600;letter-spacing:-.01em;flex:1;min-width:0}
.ai-mark{width:22px;height:22px;flex-shrink:0;border-radius:7px;background:var(--ai-bg);border:1px solid var(--ai-border);
  color:var(--ai-fg);display:grid;place-items:center;font-size:.6875rem;font-weight:800}
.ai-thread{max-height:420px;overflow-y:auto;padding:12px 16px}
.msg-row{display:flex;margin-top:12px}
.msg-row.user{justify-content:flex-end}
.msg-row.assistant{align-items:flex-start;gap:10px}
.bubble{max-width:86%;white-space:pre-wrap;border-radius:var(--radius-card);border:1px solid;padding:8px 12px;font-size:.8125rem;line-height:1.3rem}
.bubble.user{border-color:var(--border-subtle);background:var(--sunken)}
.bubble.assistant{border-color:var(--ai-border);background:var(--surface);color:var(--text-secondary)}
.ai-chips{display:flex;flex-wrap:wrap;gap:6px;border-top:1px solid rgba(204,214,226,.6);padding:10px 16px}
.ai-form{display:flex;gap:8px;border-top:1px solid rgba(204,214,226,.6);padding:12px 16px}
.briefing-lead{color:var(--text-secondary)}
.briefing-b{display:flex;gap:8px;align-items:flex-start;color:var(--text-secondary);margin-top:5px}
.briefing-b::before{content:"";width:6px;height:6px;border-radius:99px;background:rgba(66,84,111,.55);margin-top:8px;flex-shrink:0}
.focus-line{margin-top:12px;padding-top:10px;border-top:1px solid rgba(204,214,226,.6)}
.focus-line .fl{font-size:.8125rem;font-weight:600;color:var(--text-primary)}
.focus-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.focus-actions a{display:inline-flex;align-items:center;gap:6px;border-radius:99px;border:1px solid var(--action-tint-border);
  background:var(--action-tint);color:var(--action-primary);padding:3px 12px;font-size:.8125rem;font-weight:600}
.focus-actions a:hover{border-color:var(--brand-orange)}
.focus-actions a .n{width:16px;height:16px;border-radius:99px;background:var(--brand-orange);color:#fff;display:grid;place-items:center;
  font-size:.6875rem;font-weight:700}
.appr-card{border:1px solid var(--ai-border);background:var(--surface);border-radius:var(--radius-card);padding:14px 16px;margin-top:10px}
.draft-body{white-space:pre-wrap;border:1px solid var(--border-subtle);background:var(--sunken);border-radius:var(--radius-control);
  padding:10px 12px;margin-top:10px;font-size:.8125rem;line-height:1.3rem;color:var(--text-secondary)}
.queue-row{display:flex;gap:10px;align-items:flex-start;padding:11px 16px;border-bottom:1px solid var(--border-subtle)}
.queue-row:last-child{border-bottom:none}
.queue-dot{width:8px;height:8px;border-radius:99px;margin-top:7px;flex-shrink:0;background:var(--border-strong)}
.queue-dot.crit{background:var(--critical-fg)}
.queue-dot.warn{background:var(--warning-fg)}
.queue-dot.ai{background:var(--ai-fg)}
.queue-dot.brand{background:var(--brand-orange)}

/* ---- pipeline ----------------------------------------------------------- */
.kanban{display:flex;gap:12px;overflow-x:auto;padding:16px 24px 28px}
.kcol{width:270px;flex-shrink:0;display:flex;flex-direction:column}
.kcol-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px;padding:0 2px}
.kcol-head h3{font-size:.75rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.kcol-body{flex:1;background:rgba(240,242,245,.6);border-radius:.5rem;padding:8px;display:flex;flex-direction:column;gap:6px;min-height:60px}
.loan-card{background:var(--surface);border:1px solid var(--border-subtle);border-radius:var(--radius-control);
  box-shadow:var(--shadow-1);padding:10px 12px}
.loan-card .nm{font-weight:600;font-size:.875rem}
.loan-card .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
.amount-chip{display:inline-flex;border-radius:5px;background:var(--sunken);border:1px solid var(--border-subtle);
  padding:0 6px;font-size:.75rem;font-weight:600;color:var(--text-secondary)}
.urg{font-size:.75rem;font-weight:600;margin-top:6px}
.urg.crit{color:var(--critical-fg)}
.urg.warn{color:var(--warning-fg)}
.filterbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 24px 0}

/* ---- conversations ------------------------------------------------------ */
.conv-split{display:flex;gap:16px;padding:16px 24px 28px;align-items:flex-start}
.conv-list{width:360px;flex-shrink:0}
.conv-item{display:block;width:100%;text-align:left;padding:11px 14px;border-bottom:1px solid var(--border-subtle)}
.conv-item:last-child{border-bottom:none}
.conv-item:hover{background:var(--sunken)}
.conv-item.on{background:var(--action-tint)}
.conv-thread{flex:1;min-width:0}
.thread-msgs{padding:16px;display:flex;flex-direction:column;gap:12px}
.tmsg{max-width:78%;border-radius:var(--radius-card);border:1px solid var(--border-subtle);padding:10px 14px;font-size:.875rem;white-space:pre-wrap}
.tmsg.in{align-self:flex-start;background:var(--surface)}
.tmsg.out{align-self:flex-end;background:var(--sunken)}
.tmsg .stamp{font-size:.6875rem;color:var(--text-muted);margin-top:6px;white-space:normal}
.trans{margin-top:8px;white-space:normal}
.trans .body{white-space:pre-wrap;border-left:3px solid var(--ai-border);padding-left:10px;margin-top:6px;color:var(--text-secondary);font-size:.8125rem}
.video-card{margin-top:10px;border:1px solid var(--border-strong);border-radius:var(--radius-control);overflow:hidden;background:var(--navy);max-width:300px;white-space:normal}
.video-thumb{position:relative;height:110px;display:grid;place-items:center;background:linear-gradient(135deg,#16202f,#0f1826)}
.video-thumb .play{width:40px;height:40px;border-radius:99px;background:rgba(243,111,40,.9);display:grid;place-items:center}
.video-thumb .play::before{content:"";border-style:solid;border-width:7px 0 7px 12px;border-color:transparent transparent transparent #fff;margin-left:3px}
.video-thumb .dur{position:absolute;right:8px;bottom:8px;background:rgba(5,7,8,.7);color:#fff;font-size:.6875rem;font-weight:600;border-radius:4px;padding:1px 5px}
.video-meta{background:var(--surface);padding:8px 10px}
.video-meta .t{font-weight:600;font-size:.8125rem}
.video-meta .c{font-size:.75rem;color:var(--text-muted)}
.newest-hint{font-size:.75rem;font-weight:600;color:var(--text-muted);letter-spacing:.02em}

/* ---- marketing / partners / team / intelligence ------------------------- */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.mk-card{background:var(--surface);border:1px solid var(--border-subtle);border-radius:var(--radius-card);box-shadow:var(--shadow-1);padding:14px 16px;display:block}
a.mk-card:hover{border-color:var(--border-strong);box-shadow:var(--shadow-2)}
.mk-nums{display:flex;gap:18px;margin-top:10px}
.mk-nums .n .v{font-size:1.0625rem;font-weight:600}
.mk-nums .n .l{font-size:.6875rem;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);font-weight:600}
.tpl-row{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--border-subtle)}
.tpl-row:last-child{border-bottom:none}
.vid-card{background:var(--surface);border:1px solid var(--border-subtle);border-radius:var(--radius-card);box-shadow:var(--shadow-1);overflow:hidden}
.vid-card .ph{height:120px;background:linear-gradient(135deg,#16202f,#0f1826);display:grid;place-items:center;position:relative}
.vid-card .ph .play{width:38px;height:38px;border-radius:99px;background:rgba(232,236,242,.16);display:grid;place-items:center}
.vid-card .ph .play::before{content:"";border-style:solid;border-width:6px 0 6px 11px;border-color:transparent transparent transparent #e8ecf2;margin-left:3px}
.team-split{display:flex;gap:16px;padding:16px 24px 28px;align-items:flex-start}
.share-bar{width:120px;height:8px;background:var(--sunken);border-radius:99px;overflow:hidden;display:inline-block;vertical-align:middle}
.share-bar i{display:block;height:100%;background:var(--brand-orange);border-radius:99px}
.tier-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1px;background:var(--border-subtle);
  border:1px solid var(--border-subtle);border-radius:var(--radius-card);overflow:hidden;margin-bottom:14px}
.tier-cell{background:var(--surface);padding:11px 14px}
.tier-cell .t{font-size:.8125rem;font-weight:700}
.tier-cell .d{font-size:.75rem;color:var(--text-secondary);margin-top:2px;line-height:1.05rem}
.rank{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:99px;font-size:.75rem;font-weight:700;
  background:var(--sunken);color:var(--text-muted)}
.rank.r1{background:var(--brand-orange);color:#fff}
.rank.r2{background:var(--neutral-bg);border:1px solid var(--border-strong);color:var(--text-primary)}
.rank.r3{background:var(--action-tint);border:1px solid var(--action-tint-border);color:var(--action-primary)}
.pillbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.merge-chip{display:inline-flex;border-radius:5px;border:1px solid var(--ai-border);background:var(--ai-bg);color:var(--ai-fg);
  padding:0 5px;font-size:.75rem;font-weight:600;white-space:nowrap}
.compliance{display:flex;gap:10px;border:1px solid var(--warning-border);background:var(--warning-bg);
  border-radius:var(--radius-control);padding:11px 14px;margin-top:12px}
.compliance .h{font-size:.8125rem;font-weight:700;color:var(--warning-fg)}
.compliance .b{font-size:.8125rem;color:var(--text-secondary);margin-top:2px}
.preview-shell{border:1px solid var(--border-subtle);border-radius:var(--radius-card);background:var(--sunken);padding:18px;display:flex;justify-content:center}
.preview-msg{background:var(--surface);border:1px solid var(--border-subtle);border-radius:8px;box-shadow:var(--shadow-2);
  width:100%;max-width:560px;padding:18px 20px;white-space:pre-wrap;font-size:.875rem;line-height:1.4rem}
.preview-msg.mobile{max-width:320px;border-radius:18px;padding:14px 16px;font-size:.8125rem}
.opp-card{border:1px solid var(--border-subtle);border-left:3px solid var(--brand-orange);background:var(--surface);
  border-radius:var(--radius-control);padding:11px 14px}
.opp-card .f{font-weight:600}
.opp-card .s{font-size:.8125rem;color:var(--text-secondary);margin-top:2px}
.selbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--action-tint);border-bottom:1px solid var(--action-tint-border);padding:8px 14px}
input.rowcheck{width:15px;height:15px;accent-color:var(--action-primary)}
.deflist{display:grid;grid-template-columns:88px 1fr;gap:4px 12px;margin-top:12px}
.deflist dt{font-size:.6875rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);padding-top:2px}
.deflist dd{font-size:.8125rem;color:var(--text-secondary)}

/* ---- compose ------------------------------------------------------------ */
.form-row{margin-top:14px}
.form-row label{display:block;font-size:.75rem;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--text-muted);margin-bottom:5px}
.preview-video{width:100%;max-height:280px;background:#050708;border-radius:var(--radius-control);display:block}

@media (max-width: 900px){
  #sidebar{width:64px}
  #sidebar .navitem span,.sb-foot,.sb-logo img{display:none}
  .sb-logo{padding:0}
  .sb-logo::after{content:"LF";color:var(--brand-orange);font-weight:800;font-size:1rem;margin:0 auto}
  .conv-split,.team-split{flex-direction:column}
  .conv-list{width:100%}
}
</style>
</head>

ompany NMLS 320841\nThis is not a commitment to lend. All loans subject to credit approval.\nEqual Housing Opportunity.","sms_body":"Hi {{BorrowerName}} — {{LoanOfficerName}} at Loan Factory. A mutual friend passed along your name; I'd love to help. I'll reach out today. Reply STOP to opt out.","video_meta":null,"drip":[],"audience_label":"New leads referred by a past client","audience_type":"past_client_referrals","audience_size":6,"scheduled_for":null,"sent_count":5,"open_count":4,"reply_count":2,"created_days_ago":24,"owner":"Minh Nguyen","template_ref":null,"template_name":null,"template_policy":null},{"id":"874d2036-fa0c-46d2-ae27-3c2aa04e88dc","name":"New lead welcome — first 10 days","status":"running","language":"en","email_body":"Hi {{BorrowerName}},\n\nThanks for reaching out — you're in the right place. Over the next few days I'll send you a short, useful series: what a preapproval actually involves, what lenders look at, and the questions worth asking anyone who offers you a loan (including me).\n\nNo pressure and no obligation — when you're ready to talk numbers, I'm one reply away.\n\n{{LoanOfficerName}}\nNMLS {{NMLS}} — Company NMLS 320841\nThis is not a commitment to lend. All loans subject to credit approval.\nEqual Housing Opportunity.","sms_body":"Hi {{BorrowerName}} — {{LoanOfficerName}} at Loan Factory. Got your request; I'll call you shortly. Meanwhile, reply here with any questions. Reply STOP to opt out.","video_meta":null,"drip":[],"audience_label":"New leads in their first 10 days","audience_type":"new_leads","audience_size":26,"scheduled_for":null,"sent_count":22,"open_count":11,"reply_count":4,"created_days_ago":18,"owner":"Minh Nguyen","template_ref":null,"template_name":null,"template_policy":null},{"id":"b752bb41-2933-414d-b2e8-5fe17f24c46a","name":"Bản tin quý — khách hàng người Việt","status":"finished","language":"vi","email_body":"Chào anh chị,\n\nBản tin quý này: lãi suất đang đi về đâu, thị trường nhà quanh Seattle thế nào, và ba điều nên chuẩn bị nếu anh chị định mua hoặc tái tài trợ trong năm nay.\n\nCó câu hỏi nào, anh chị cứ trả lời email này — em luôn sẵn sàng.\n\nThúy Phạm\nNMLS 1901288 — Company NMLS 320841\nĐây không phải là cam kết cho vay. Mọi khoản vay đều phải được duyệt tín dụng.\nCơ hội Nhà ở Bình đẳng.","sms_body":"Chào anh chị — Thúy ở Loan Factory. Bản tin quý đã gửi qua email, anh chị xem nhé. Có câu hỏi cứ nhắn lại. Nhắn STOP để ngưng nhận tin.","video_meta":null,"drip":[],"audience_label":"Vietnamese-speaking clients","audience_type":"custom_demo","audience_size":24,"scheduled_for":null,"sent_count":24,"open_count":17,"reply_count":6,"created_days_ago":16,"owner":"Thúy Phạm","template_ref":null,"template_name":null,"template_policy":null},{"id":"df370941-f4c6-4145-90ca-9336e7a927ae","name":"Agent partner monthly update","status":"running","language":"en","email_body":"Hi {{PartnerName}},\n\nHere's this month's snapshot for your buyers: what inventory is doing in our core zip codes, how preapproval turn times are running, and one financing option your first-time buyers may not know about.\n\nIf you have a buyer who's stuck — on payment, on down payment, on documentation — send them my way and I'll give them a straight answer either way.\n\n{{LoanOfficerName}}\nNMLS {{NMLS}} — Company NMLS 320841\nThis is not a commitment to lend. All loans subject to credit approval.\nEqual Housing Opportunity.","sms_body":"Hi {{PartnerName}} — {{LoanOfficerName}} at Loan Factory. Mid-month check-in: any buyers stuck on financing I can help un-stick? Reply STOP to opt out.","video_meta":null,"drip":[{"day":0,"channel":"email","subject":"This month's market snapshot for your buyers"},{"day":14,"channel":"sms","subject":"Mid-month check-in — any buyers stuck?"}],"audience_label":"All referral partners","audience_type":"partners","audience_size":6,"scheduled_for":null,"sent_count":6,"open_count":4,"reply_count":2,"created_days_ago":12,"owner":"Minh Nguyen","template_ref":"EMT-031","template_name":"Appraisal Scheduled","template_policy":"fully_automated"},{"id":"d3d7b356-37a1-4f9f-895a-3626dd9211c5","name":"Preapproval issued — house hunting kit","status":"running","language":"en","email_body":"Hi {{BorrowerName}},\n\nYour preapproval letter is attached — congratulations, you're officially house-hunting.\n\nA few things that make the next weeks easier: how to read a seller's counter without panicking, why your preapproval amount is a ceiling and not a target, and what NOT to do with your credit until we close (short version: nothing new).\n\nSend me any listing and I'll run real payment numbers on it, usually same day.\n\n{{LoanOfficerName}}\nNMLS {{NMLS}} — Company NMLS 320841\nThis is not a commitment to lend. All loans subject to credit approval.\nEqual Housing Opportunity.","sms_body":"Hi {{BorrowerName}} — preapproval letter is in your inbox. Send me any listing and I'll run real numbers on it. — {{LoanOfficerName}}. Reply STOP to opt out.","video_meta":null,"drip":[],"audience_label":"Borrowers with a freshly issued preapproval","audience_type":"preapproval_issued","audience_size":14,"scheduled_for":null,"sent_count":13,"open_count":10,"reply_count":5,"created_days_ago":6,"owner":"Minh Nguyen","template_ref":null,"template_name":null,"template_policy":null},{"id":"9673d029-896f-4e20-9dfd-386fbb2017df","name":"Preapproval expiring — 30 day nudge","status":"scheduled","language":"en","email_body":"Hi {{BorrowerName}},\n\nYour preapproval letter has an expiration date coming up, and I'd rather refresh it early than have it lapse mid-house-hunt.\n\nThe refresh usually takes a few minutes: I confirm nothing has changed, re-run the numbers, and issue an updated letter so your offers stay strong.\n\nReply to this email or call me and we'll get it done.\n\n{{LoanOfficerName}}\nNMLS {{NMLS}} — Company NMLS 320841\nThis is not a commitment to lend. All loans subject to credit approval.\nEqual Housing Opportunity.","sms_body":"Hi {{BorrowerName}} — your prea /* ======================= helpers ======================= */
const NOW = new Date(DATA.generatedAt || Date.now());
const $ = (sel, el) => (el || document).querySelector(sel);
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function moneyCompact(n){
  n = Number(n || 0);
  if (n >= 1e6){ const v = (n/1e6).toFixed(1); return "$" + (v.endsWith(".0") ? v.slice(0,-2) : v) + "M"; }
  if (n >= 1e3) return "$" + Math.round(n/1e3) + "K";
  return "$" + Math.round(n);
}
function money(n){ return "$" + Number(n||0).toLocaleString("en-US"); }
function daysUntil(dateStr){
  if (!dateStr) return null;
  const d = new Date(String(dateStr).slice(0,10) + "T12:00:00");
  if (isNaN(d)) return null;
  return Math.round((d - NOW) / 86400000);
}
function mmss(seconds){
  if (seconds == null) return "—";
  const m = Math.floor(seconds/60), s = Math.round(seconds%60);
  return m + ":" + String(s).padStart(2,"0");
}
function durLabel(sec){ return mmss(sec); }
function initials(name){
  return String(name||"").split(/\s+/).map(w => w[0] || "").join("").slice(0,2).toUpperCase();
}
function agoLabel(hours){
  if (hours == null) return "";
  if (hours < 1) return "just now";
  if (hours < 24) return hours + "h ago";
  return Math.floor(hours/24) + "d ago";
}
const LANG_NAMES = { en:"English", es:"Spanish", vi:"Vietnamese", ru:"Russian", zh:"Chinese" };
function langBadge(lang){
  if (!lang || lang === "en") return "";
  return '<span class="lang-badge">' + esc(String(lang).toUpperCase()) + '</span>';
}
function personName(p){ return ((p.first_name||"") + " " + (p.last_name||"")).trim(); }

const VIEW_OF_STAGE = {
  new_lead:"leads", contact_attempt:"leads", consultation_scheduled:"leads",
  consultation_completed:"leads", prequalification:"leads", preapproval:"leads",
  searching_for_home:"leads",

function viewOf(stage, loanStatus){
  if (loanStatus === "funded") return "past";
  return VIEW_OF_STAGE[stage] || "leads";
}
function stagesInView(view){ return STAGES.filter(s => VIEW_OF_STAGE[s] === view); }
/* Quiet threshold: 3 days for a file in motion (Transact stages), 7 elsewhere. */
const TRANSACT_STAGES = { under_contract:1, application:1, disclosures:1, processing:1,
  submitted_to_underwriting:1, conditional_approval:1, clear_to_close:1, closing_scheduled:1, funded:1 };
function stallDays(stage){ return TRANSACT_STAGES[stage] ? 3 : 7; }

const CHANNEL_NAMES = {
  lf_website:"LF website", qm_pricer:"QM pricer", facebook_ads:"Facebook ads",
  partner_referral:"Partner referral", email:"Email", manual:"Manual entry", csv_import:"CSV import"
};
function channelName(ch){
  if (!ch) return "—";
  if (CHANNEL_NAMES[ch]) return CHANNEL_NAMES[ch];
  const w = String(ch).replace(/_/g," ");
  return w.charAt(0).toUpperCase() + w.slice(1);
}

/* Urgency for an active file. Returns {tone,label,score} or null. */
function urgencyOf(p){
  const lock = daysUntil(p.rate_lock_expires_at);
  if (lock != null && lock < 0 && p.loan_status === "active")
    return { tone:"crit", label:"Lock expired " + (-lock) + "d ago", score: -5 };
  if (lock != null && lock >= 0 && lock <= 3)
    return { tone:"crit", label:"Lock expires in " + lock + "d", score: lock };
  const close = daysUntil(p.closing_date);
  if (close != null && close >= 0 && close <= 5)
    return { tone:"crit", label:"Closes in " + close + "d", score: 10 + close };
  if ((p.idle_days || 0) > stallDays(p.stage))
    return { tone:"warn", label:"No movement " + p.idle_days + "d", score: 100 - Math.min(p.idle_days,60) };
  return null;
}

function waitingLeadRows(){

    .filter(p => p.waiting_first_reply && p.loan_status === "active")
    .sort((a,b) => (b.captured_hours_ago||0) - (a.captured_hours_ago||0));
}
function lockRows(maxDays){
  return activeLoans()
    .map(p => ({ p, d: daysUntil(p.rate_lock_expires_at) }))
    .filter(x => x.d != null && x.d <= maxDays)
    .sort((a,b) => a.d - b.d);
}
function closingRows(maxDays){
  return activeLoans()
    .map(p => ({ p, d: daysUntil(p.closing_date) }))
    .filter(x => x.d != null && x.d >= 0 && x.d <= maxDays)
    .sort((a,b) => a.d - b.d);
}
function stalledRows(){
  return activeLoans()
    .filter(p => !p.waiting_first_reply && (p.idle_days || 0) > stallDays(p.stage))
    .sort((a,b) => (b.idle_days||0) - (a.idle_days||0));
}

  }));
  stalledRows().slice(0,1).forEach(p => out.push({

  }));
  pendingApprovals().slice(0,1).forEach(a => out.push({

  closingRows(7).slice(0,1).forEach(x => out.push({

  }));
  return out.sort((a,b) => a.rank - b.rank).slice(0,3);

function briefingHtml(){
  const dateLine = new Intl.DateTimeFormat("en-US", { weekday:"long", month:"long", day:"numeric" }).format(NOW);
  const leads = waitingLeadRows();
  const locks = lockRows(3);
  const closings = closingRows(7);
  const stalled = stalledRows();
  const dayRead = [];
  if (leads.length) dayRead.push(leads.length + " new lead" + (leads.length === 1 ? "" : "s") + " to call");
  if (closings.length) dayRead.push(closings.length + " closing" + (closings.length === 1 ? "" : "s") + " this week");
  if (locks.length) dayRead.push(locks.length + " lock" + (locks.length === 1 ? "" : "s") + " that need" + (locks.length === 1 ? "s" : "") + " attention");
  const lead = dateLine + ". " + (dayRead.length
    ? dayRead.join(" and ").replace(/^./, c => c.toUpperCase()) + "."
    : "Nothing is at a deadline today.");
  const bullets = [];
  if (leads.length){
    const oldest = leads[0];
    bullets.push(leads.length === 1
      ? "One new lead is waiting on a first call: " + personName(oldest) + ". Call them first."
      : leads.length + " new leads are waiting on a first call — the oldest is " + personName(oldest) + ". Start there.");
  }
  const slipping = [];
  if (DATA.tasksOverdue.length) slipping.push(DATA.stats.overdue_tasks + " overdue follow-ups");
  if (stalled.length) slipping.push(stalled.length + " files that have gone quiet");
  if (slipping.length) bullets.push("The team also has " + slipping.join(" and ") + ".");
  if (pendingApprovals().length)
    bullets.push("AI has " + pendingApprovals().length + " things ready for your approval. Nothing goes out until you say so.");
  const top = topThree();
  const focus = top.length >= 2
    ? "If you only do three things today: " + top.map(t => t.label.charAt(0).toLowerCase() + t.label.slice(1)).join(", then ") + "."
    : null;
  return '<p class="briefing-lead">' + esc(lead) + '</p>' +
    bullets.map(b => '<div class="briefing-b"><span>' + esc(b) + '</span></div>').join("") +
    (focus ? '<div class="focus-line"><p class="fl">' + esc(focus) + '</p>' +

}

/* ---- assistant (client-side, dataset-only, mirrors the mock engine) ---- */
function assistantAnswer(q){
  const t = q.toLowerCase();
  let body;
  if (/(focus|priorit|first|start|do today|today\?)/.test(t)) body = ansFocus();
  else if (/(quiet|stall|idle|no movement|silent|cold)/.test(t)) body = ansQuiet();
  else if (/(pipeline|summar|volume|phase|files)/.test(t)) body = ansPipeline();
  else if (/(draft|approval|approve|waiting|queue)/.test(t)) body = ansDrafts();
  else if (/(clos|fund|lock|settle)/.test(t)) body = ansClosings();
  else body = "I can answer from your CRM records — what to focus on, who has gone quiet, a pipeline summary, waiting drafts, or upcoming closings. Try one of the suggested prompts.";
  return body + "\n\n" + PREVIEW_NOTE;
}
/** Five numbered priorities, new leads first — mirrors engine.ts focusToday(). */
function ansFocus(){
  const leads = waitingLeadRows();
  const followUps = DATA.tasksOverdue;
  const stalled = stalledRows();
  const locks = lockRows(3);
  const expired = locks.filter(x => x.d < 0);
  const upcoming = locks.filter(x => x.d >= 0);
  const closings = closingRows(7);
  const approvals = pendingApprovals();
  const sections = [];
  if (leads.length){
    sections.push({ title:"New leads needing contact (" + leads.length + ")",
      lines: leads.slice(0,5).map(p => {
        const src = LEAD_SOURCE_PHRASES[p.lead_channel];
        const wait = p.captured_hours_ago >= 24 ? Math.floor(p.captured_hours_ago/24) + "d" : p.captured_hours_ago + "h";
        return "• Call " + personName(p) + " — new " + (src ? src + " " : "") + "lead, no contact yet (waiting " + wait + ")";
      }) });
  }
  if (followUps.length){
    sections.push({ title:"Applications needing follow-up (" + Math.min(followUps.length, DATA.stats.overdue_tasks) + ")",
      lines: followUps.slice(0,5).map(t => "• " + (t.person ? t.person + " — " : "") + t.title + " (overdue)") });
  }
  if (stalled.length || expired.length){
    sections.push({ title:"Loans needing attention (" + (stalled.length + expired.length) + ")",
      lines: expired.map(x => "• " + personName(x.p) + "'s rate lock expired " + (-x.d) + "d ago — this needs you personally")
        .concat(stalled.slice(0,5).map(p => "• " + personName(p) + " — " + stageLabel(p.stage) + ", quiet " + p.idle_days + "d — a call restarts the file")) });
  }
  if (approvals.length){
    sections.push({ title:"Approvals waiting (" + approvals.length + ")",
      lines: approvals.slice(0,3).map(a => "• " + a.title + (a.person ? " — " + a.person : ""))
        .concat(["Nothing goes out until you approve it."]) });
  }
  if (closings.length || upcoming.length){
    sections.push({ title:"Closings and expiring locks in the next 7 days (" + (closings.length + upcoming.length) + ")",
      lines: closings.map(x => "• " + personName(x.p) + " closes in " + x.d + "d (" + moneyCompact(x.p.amount) + ")")
        .concat(upcoming.map(x => "• " + personName(x.p) + "'s lock expires in " + x.d + "d")).slice(0,5) });
  }
  const out = [leads.length ? "Here's your day, in priority order — new leads first:" : "Here's your day, in priority order:"];
  sections.forEach((s,i) => { out.push("", (i+1) + ". " + s.title); s.lines.forEach(l => out.push(l)); });
  return out.join("\n");
}
function ansQuiet(){
  const quiet = stalledRows().slice(0,6);
  if (!quiet.length) return "No active file has gone quiet — everything has moved inside its stage's limit (3 days in Transact, 7 elsewhere).";
  const lines = [quiet.length + " active files have gone quiet past the limit for their stage:", ""];
  quiet.forEach(p => lines.push("• " + personName(p) + " — " + stageLabel(p.stage) + ", no activity for " + p.idle_days + " days (owner " + p.owner + ")"));
  const qp = DATA.partners.filter(pt => pt.tier === "quiet").length;
  if (qp) lines.push("", "Also: " + qp + " referral partners are in the Quiet tier — worth a check-in this week.");
  return lines.join("\n");
}
function ansPipeline(){
  const recs = pipelineRecords();
  const act = activeLoans();
  const lines = ["Your pipeline right now:", "",
    "• " + act.length + " active files, " + moneyCompact(act.reduce((s,p)=>s+Number(p.amount||0),0)) + " in volume"];
  const viewLine = PIPELINE_VIEWS.map(v => VIEW_LABELS[v] + " " + recs.filter(r => r.view === v).length).join(" · ");
  lines.push("• " + viewLine);
  lines.push("• " + moneyCompact(DATA.stats.funded_mtd) + " funded this month (" + DATA.stats.funded_mtd_count + " files)");

}
function ansDrafts(){
  const pend = pendingApprovals();
  if (!pend.length) return "The approval queue is clear.";
  const lines = [pend.length + " AI drafts are waiting on Today:", ""];
  pend.forEach(a => lines.push("• " + a.title + (a.language && a.language !== "en" ? " (" + (LANG_NAMES[a.language] || a.language) + ")" : "")));

  return lines.join("\n");
}
function ansClosings(){
  const soon = closingRows(14);
  if (!soon.length) return "No closings inside the next two weeks.";
  const lines = [soon.length + " file" + (soon.length === 1 ? " closes" : "s close") + " within 14 days:", ""];

}

const AMOUNT_BUCKETS = [
  { value:"lt300", label:"Under $300K", min:0, max:300000 },
  { value:"300-500", label:"$300K – $500K", min:300000, max:500000 },
  { value:"500-750", label:"$500K – $750K", min:500000, max:750000 },
  { value:"gt750", label:"Over $750K", min:750000, max:Infinity }
];
const ACTIVITY_WINDOWS = [
  { value:"24h", label:"Active today", test: d => d <= 1 },
  { value:"7d", label:"Active this week", test: d => d <= 7 },
  { value:"30d", label:"Active this month", test: d => d <= 30 },
  { value:"older", label:"Quiet 30+ days", test: d => d > 30 }
];
function recordAmount(r){ return Number(r.amount || r.preapproval_amount || 0) || null; }
function recordAttention(r){
  if (r.waiting_first_reply) return { text:"Waiting on first call", tone:"crit" };
  if (r.docs_needed && r.docs_needed_summary) return { text:"Docs needed: " + r.docs_needed_summary, tone:"warn" };
  const u = r.loan_status === "active" ? urgencyOf(r) : null;
  if (u) return { text:u.label, tone:u.tone };
  return null;
}
function filteredPipeline(){
  const f = S.pipeline;
  return pipelineRecords().filter(r => {
    if (r.view !== f.view) return false;
    if (f.owner !== "all" && (r.owner || "—") !== f.owner) return false;
    if (f.source !== "all" && (r.lead_channel || "none") !== f.source) return false;
    if (f.amt !== "all"){
      const b = AMOUNT_BUCKETS.find(x => x.value === f.amt);
      const amt = recordAmount(r);
      if (!b || amt == null || amt < b.min || amt >= b.max) return false;
    }
    if (f.act !== "all"){
      const w = ACTIVITY_WINDOWS.find(x => x.value === f.act);
      if (!w || !w.test(r.idle_days || 0)) return false;
    }
    if (f.attn && !recordAttention(r)) return false;
    return true;
  });
}
function pipelineTiles(view, rows){
  const vol = rows.reduce((s,r)=>s+(recordAmount(r)||0),0);
  if (view === "leads"){
    return [
      ["Leads", rows.length],
      ["Waiting on first call", rows.filter(r => r.waiting_first_reply).length],
      ["Preapproved", rows.filter(r => r.stage === "preapproval").length],
      ["Potential volume", moneyCompact(vol)]
    ];
  }
  if (view === "applications"){
    return [
      ["Applications", rows.length],
      ["Volume", moneyCompact(vol)],
      ["Docs needed", rows.filter(r => r.docs_needed).length],
      ["In underwriting", rows.filter(r => r.stage === "submitted_to_underwriting").length]
    ];
  }
  if (view === "loans"){
    return [
      ["Loans", rows.length],
      ["Volume", moneyCompact(vol)],
      ["Closing in 7 days", rows.filter(r => { const d = daysUntil(r.closing_date); return d != null && d >= 0 && d <= 7; }).length],
      ["Locks inside 3 days", rows.filter(r => { const d = daysUntil(r.rate_lock_expires_at); return d != null && d <= 3; }).length]
    ];
  }
  return [
    ["Past clients", rows.length],
    ["Funded volume", moneyCompact(rows.reduce((s,r)=>s+Number(r.amount||0),0))],
    ["Refi opportunities", rows.filter(r => r.stage === "refinance_opportunity").length],
    ["Anniversaries in 45 days", (DATA.intelligence.team.anniversaries || []).length]
  ];
}

function exportSelectedCsv(){
  const rows = selectedPeople();
  if (!rows.length) return;
  const head = ["First name","Last name","Type","Email","Phone","City","Language","Stage","Owner"];
  const csv = [head.join(",")].concat(rows.map(p => [
    p.first_name, p.last_name, TYPE_LABELS[p.type] || p.type, p.email || "", p.phone || "",
    p.city || "", LANG_NAMES[p.language] || "English", p.stage ? stageLabel(p.stage) : "", p.owner || ""
  ].map(v => '"' + String(v).replace(/"/g,'""') + '"').join(","))).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type:"text/csv" }));
  a.download = "loan-factory-people-export.csv";
  document.body.appendChild(a);
  a.click();
  a.remove();
  S.people.note = rows.length + " people exported to CSV from the demo dataset — a real download, built entirely in this file.";
  render();
}

function addDraftThread(p, channel, subject, body){
  const id = "demo-draft-" + Date.now();
  DATA.conversations.unshift({
    id, subject: subject || "Draft message", channel, awaiting_reply:false, hours_ago:0,
    with_name: personName(p), with_kind:"person", person_id:p.id,
    language: p.language || "en", owner: (DATA.viewer && DATA.viewer.name) || "",
    messages: [{ channel, direction:"outbound", body: body || "", status:"draft",
      preparedByAi:false, translationEn:null, video:null, hoursAgo:0,
      author: (DATA.viewer && DATA.viewer.name) || "" }]
  });
  return id;
}

/* ======================= Conversations ======================= */
const CONV_TABS = [
  ["all","All"],["waiting","Waiting on you"],["email","Email"],["sms","Text"],
  ["video","Video email"],["app","App message"],["call","Calls"],["note","Notes"]
];
function convCounts(){
  const c = { all: DATA.conversations.length, waiting: DATA.conversations.filter(x => x.awaiting_reply).length };
  ["email","sms","video","app","call","note"].forEach(k => {
    c[k] = DATA.conversations.filter(x => x.channel === k).length;
  });
  return c;
}
/** What the newest message honestly is — mirrors previewOf() in the app. */
function previewOf(c){
  const m = (c.messages && c.messages[0]) || null;
  if (!m || !m.body) return null;
  const text = String(m.body).replace(/\s+/g," ").trim();
  if (m.direction === "outbound"){
    if (m.status === "draft") return { prefix:"Your draft:", text };
    if (m.status === "awaiting_approval") return { prefix:"Waiting for approval:", text };
    if (m.status === "approved") return { prefix:"Approved, not sent:", text };
    if (m.status === "sent") return { prefix:"You:", text };
  }
  return { prefix:null, text };
}
function convItemHtml(c, selectedId){
  const pv = previewOf(c);
  return '<a class="conv-item' + (c.id === selectedId ? " on" : "") + '" href="#/conversations/' + esc(c.id) + '">' +
    '<div style="display:flex;gap:8px;align-items:center">' + channelIcon(c.channel) +
      '<strong style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(c.with_name) + '</strong>' +
      langBadge(c.language) +
      (c.awaiting_reply ? '<span class="badge b-warning">Waiting on you</span>' : "") + '</div>' +
    '<div class="small sec" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px">' + esc(c.subject || CONV_CHANNEL_LABELS[c.channel] || "") + '</div>' +
    (pv ? '<div class="micro muted" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px">' +
      (pv.prefix ? '<span style="color:var(--ai-fg);font-weight:600">' + esc(pv.prefix) + '</span> ' : "") + esc(pv.text) + '</div>' : "") +
    '<div class="micro muted" style="margin-top:2px">' + esc(c.owner || "") + ' · ' + esc(agoLabel(c.hours_ago)) + '</div>' +
  '</a>';
}
const MSG_STATUS_LABELS = {
  draft:"Draft — not sent", awaiting_approval:"Waiting for approval — not sent",
  approved:"Approved, not sent", failed:"Failed to send"
};
function threadMsgHtml(m, conv){
  const out = m.direction === "outbound";
  let inner = esc(m.body || "");
  let extras = "";
  if (m.translationEn){
    extras += '<details class="why trans"><summary>English translation</summary>' +
      '<div class="body"><p class="micro muted" style="margin-bottom:4px">Generated for your reference — not a reviewed legal translation.</p>' +
      esc(m.translationEn) + '</div></details>';
  }
  if (m.video){
    extras += '<div class="video-card"><div class="video-thumb"><span class="play"></span>' +
      '<span class="dur tnum">' + durLabel(m.video.durationSeconds) + '</span></div>' +
      '<div class="video-meta"><p class="t">' + esc(m.video.title || "Video") + '</p>' +
      '<p class="c">' + esc(m.video.caption || "") + '</p>' +
      '<p class="c" style="color:var(--warning-fg);font-weight:600">Demo video attachment</p></div></div>';
  }
  const stampBits = [];
  if (MSG_STATUS_LABELS[m.status]) stampBits.push('<span style="color:var(--ai-fg);font-weight:600">' + MSG_STATUS_LABELS[m.status] + '</span>');
  if (m.preparedByAi) stampBits.push('<span class="badge b-ai">Prepared by AI</span>');
  if (m.callOutcome) stampBits.push(esc(m.callOutcome));
  if (m.hoursAgo != null && !MSG_STATUS_LABELS[m.status]) stampBits.push(esc(agoLabel(m.hoursAgo)));
  return '<div class="tmsg ' + (out ? "out" : "in") + '">' + inner + extras +
    '<div class="stamp">' + (out ? esc(m.author || "You") : esc(conv.with_name)) + (stampBits.length ? " · " + stampBits.join(" · ") : "") + '</div></div>';
}

    '<div class="pillbar">' + CONV_TABS.map(([k,lb]) =>

const RANGE_PILLS = [
  ["week","This week"],["mtd","Month to date"],["prior","Prior month"],
  ["90d","Last 90 days"],["ytd","Year to date"],["custom","Custom"]
];
const INTEL_CHANNELS = {
  facebook_ads:"Facebook ads", lf_website:"Loan Factory website", qm_pricer:"QuickMatch pricer",
  partner_referral:"Partner referral", manual:"Added by hand", csv_import:"CSV import", unknown:"No source recorded"
};
function intelChannel(ch){ return INTEL_CHANNELS[ch] || String(ch).replace(/_/g," "); }
function pct(x){ return Math.round(x * 100) + "%"; }
/** Plain-language findings — a client-side port of buildOpportunities() with the same inputs. */
function buildOpportunities(scope, rangeKey){
  const sc = DATA.intelligence[scope];
  const r = sc.ranges[rangeKey];
  const h = sc.health;
  const out = [];
  if (h.uncontacted_leads > 0){
    out.push({ f: h.uncontacted_leads + (h.uncontacted_leads === 1 ? " lead has" : " leads have") + " never been contacted.",
      s:"Work the lead list today — a first call beats any campaign.", href:"#/people" });
  }
  const rated = r.sources.filter(x => x.leads >= 3 && x.leads > 0).map(x => Object.assign({ rate: x.closed / x.leads }, x));
  if (rated.length >= 2){
    const best = rated.reduce((a,b) => b.rate > a.rate ? b : a);
    const worst = rated.reduce((a,b) => b.rate < a.rate ? b : a);
    if (best.channel !== worst.channel && best.rate >= worst.rate * 2){
      out.push({ f: intelChannel(worst.channel) + " leads close at " + pct(worst.rate) + " — less than half the " +
          pct(best.rate) + " that " + intelChannel(best.channel) + " leads close at.",
        s:"Tighten follow-up on " + intelChannel(worst.channel) + " leads, or shift that effort toward " + intelChannel(best.channel) + ".",
        href:"#/people" });
    }
  }
  if (sc.anniversaries.length > 0 && h.anniversary_campaigns === 0){
    const n = sc.anniversaries.length;
    out.push({ f: n + " past " + (n === 1 ? "client hits a loan anniversary" : "clients hit loan anniversaries") +
        " in the next 45 days with no anniversary campaign running.",
      s:"Launch the anniversary campaign, or put a personal call on the calendar.", href:"#/marketing" });
  }
  if (h.quiet_partners > 0){
    out.push({ f: h.quiet_partners + " of " + h.total_partners + " referral " +
        (h.quiet_partners === 1 ? "partner has" : "partners have") + " had no recorded touch in 60 days or more.",
      s:"Book coffee or a call with the quiet ones — referrals follow attention.", href:"#/partners" });
  }
  if (h.stale_files > 0){
    out.push({ f: h.stale_files + " active " + (h.stale_files === 1 ? "file has" : "files have") + " gone quiet past the limit for their stage.",
      s:"Open the pipeline and touch the oldest ones first.", href:"#/pipeline" });
  }
  if (sc.drips.length === 0){
    out.push({ f:"No drip campaign is running right now.",
      s:"Start one — leads captured this week should hear from you next week too.", href:"#/marketing" });
  }
  return out.slice(0,6);
}

function barChart(rows){

    '<div class="bar-row"><span class="small sec" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(r.label) + '</span>' +
    '<div class="bar-track"><div class="bar-fill ' + (r.cls || "") + '" style="width:' + Math.max(2, Math.round((r.v / max) * 100)) + '%"></div></div>' +
    '<span class="small tnum" style="text-align:right">' + (r.text != null ? esc(String(r.text)) : String(r.v)) + '</span></div>'

    '<div class="section-title">Members (' + ((DATA.team || []).length) + ')</div>' +
    '<div class="card" style="overflow-x:auto"><table class="tbl">' +
      '<thead><tr><th>Name</th><th>Role</th><th>NMLS</th><th>Language</th><th>Status</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table></div>' +
    '<div class="note-box">Demo build — user management, integrations, and permissions live in the real application. Nothing here changes any system.</div></div>';
}

/* ======================= Compose (video message) ======================= */
const STARTERS = {
  en: "Hi — I recorded a short video for you. Three minutes, no obligation, and you can watch it whenever suits.",
  es: "Hola: le grabé un video corto. Son tres minutos, sin ningún compromiso, y puede verlo cuando le convenga.",
  vi: "Chào anh/chị — tôi vừa ghi một video ngắn dành cho anh/chị. Chỉ ba phút, không ràng buộc gì, xem lúc nào tiện cũng được.",
  ru: "Здравствуйте! Я записала для вас короткое видео — всего три минуты, без каких-либо обязательств. Посмотрите, когда будет удобно."
};
const CLOSERS = {
  en: "If anything in there raises a question, just reply — happy to talk it through.",
  es: "Si algo le genera dudas, respóndame y lo conversamos con gusto.",
  vi: "Nếu có điều gì cần hỏi thêm, anh/chị cứ nhắn lại — tôi rất sẵn lòng trao đổi.",
  ru: "Если появятся вопросы — просто ответьте на это письмо, с удовольствием всё обсудим."
};
function composeVideoBlock(){
  const c = S.compose;
  let inner = "";
  if (c.videoUrl){
    inner += '<video class="preview-video" controls src="' + c.videoUrl + '"></video>' +
      '<div class="video-meta" style="border:1px solid var(--border-subtle);border-radius:8px;margin-top:8px">' +
        '<p class="t">' + esc(c.videoTitle || "Video message") + '</p>' +
        '<p class="c">' + (c.videoDuration != null ? durLabel(c.videoDuration) + " · " : "") +
          esc(c.videoSource === "recorded" ? "Recorded just now" : "Uploaded from disk") + '</p></div>';
  } else if (c.recording){
    inner += '<video class="preview-video" id="live-preview" autoplay muted playsinline></video>' +
      '<button type="button" class="btn btn-primary" style="margin-top:10px" data-action="stop-record">Stop recording</button>';
  } else {
    inner += '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">' +
      '<button type="button" class="btn btn-ghost" data-action="record-video">Record video</button>' +
      '<label class="btn btn-ghost" style="cursor:pointer">Upload a video file' +
        '<input type="file" accept="video/*" id="video-file" style="display:none"></label></div>';
    if (c.cameraError) inner += '<div class="note-box">' + esc(c.cameraError) + '</div>';
  }
  return inner;
}
function composeScreen(){
  const c = S.compose;
  return '<div class="wrap" style="max-width:44rem">' +
    '<div class="page-head" style="padding-left:0;padding-right:0"><h2>Compose video message</h2>' +
      '<p>A short personal video beats a long email. Drafts land in Conversations for review.</p></div>' +
    '<div class="card" style="padding:18px 20px">' +
      '<div class="form-row" style="margin-top:0"><label for="cmp-to">To</label>' +
        '<input class="input" id="cmp-to" placeholder="Who is this for? e.g. Mai Phạm" value="' + esc(c.to || "") + '"></div>' +
      '<div class="form-row"><label for="cmp-lang">Language</label>' +
        '<select class="input" id="cmp-lang">' +
          [["en","English"],["es","Spanish"],["vi","Vietnamese"],["ru","Russian"]].map(([k,l]) =>
            '<option value="' + k + '"' + (c.lang === k ? " selected" : "") + '>' + l + '</option>').join("") +
        '</select>' +
        (c.lang !== "en" ? '<p class="micro" style="margin-top:5px;color:var(--ai-fg);font-weight:600">Written in ' +
          (LANG_NAMES[c.lang] || c.lang) + ' — a human translation review is required before this sends.</p>' : "") + '</div>' +
      '<div class="form-row"><label for="cmp-subject">Subject</label>' +
        '<input class="input" id="cmp-subject" placeholder="A quick video for you" value="' + esc(c.subject || "") + '"></div>' +
      '<div class="form-row"><label for="cmp-intro">Intro</label>' +
        '<textarea class="input" id="cmp-intro" rows="3">' + esc(c.intro != null ? c.intro : STARTERS[c.lang]) + '</textarea></div>' +
      '<div class="form-row"><label>Video</label><div id="video-block">' + composeVideoBlock() + '</div></div>' +
      '<div class="form-row"><label for="cmp-closing">Closing</label>' +
        '<textarea class="input" id="cmp-closing" rows="2">' + esc(c.closing != null ? c.closing : CLOSERS[c.lang]) + '</textarea></div>' +
      '<div style="display:flex;gap:8px;margin-top:18px">' +
        '<button type="button" class="btn btn-primary" data-action="save-draft">Save draft</button>' +
        '<a class="btn btn-ghost" href="#/marketing">Cancel</a></div>' +
      '<p class="micro muted" style="margin-top:10px">Drafts stay in this demo session only — nothing is sent, and nothing leaves this file.</p>' +
    '</div>' +
  '</div>';
}
let mediaStream = null, mediaRecorder = null, recChunks = [], recStartedAt = 0;
function syncComposeFields(){
  const c = S.compose;
  const to = $("#cmp-to"), sub = $("#cmp-subject"), intro = $("#cmp-intro"), close = $("#cmp-closing");
  if (to) c.to = to.value;
  if (sub) c.subject = sub.value;
  if (intro) c.intro = intro.value;
  if (close) c.closing = close.value;
}
function startRecording(){
  const md = navigator.mediaDevices;
  const honest = "Camera access is unavailable when this file opens directly from disk — upload a video file instead.";
  if (!md || !md.getUserMedia || typeof MediaRecorder === "undefined"){
    S.compose.cameraError = honest;
    $("#video-block").innerHTML = composeVideoBlock();
    return;
  }
  md.getUserMedia({ video:true, audio:true }).then(stream => {
    mediaStream = stream;
    S.compose.recording = true;
    S.compose.cameraError = null;
    $("#video-block").innerHTML = composeVideoBlock();
    const live = $("#live-preview");
    if (live) live.srcObject = stream;
    recChunks = [];
    recStartedAt = Date.now();
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e => { if (e.data && e.data.size) recChunks.push(e.data); };
    mediaRecorder.onstop = () => {
      const blob = new Blob(recChunks, { type: mediaRecorder.mimeType || "video/webm" });
      stream.getTracks().forEach(t => t.stop());
      mediaStream = null;
      S.compose.recording = false;
      if (!blob.size){
        S.compose.cameraError = "Nothing was captured — upload a video file instead.";
      } else {
        S.compose.videoUrl = URL.createObjectURL(blob);
        S.compose.videoSource = "recorded";
        S.compose.videoTitle = ($("#cmp-subject") && $("#cmp-subject").value) || "Video message";
        S.compose.videoDuration = Math.round((Date.now() - recStartedAt) / 1000);
      }
      $("#video-block").innerHTML = composeVideoBlock();
    };
    mediaRecorder.start();
  }).catch(() => {
    S.compose.recording = false;
    S.compose.cameraError = honest;
    $("#video-block").innerHTML = composeVideoBlock();
  });
}
function stopRecording(){
  if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
  else if (mediaStream){ mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
}
function handleVideoFile(file){
  if (!file) return;
  S.compose.videoUrl = URL.createObjectURL(file);
  S.compose.videoSource = "uploaded";
  S.compose.videoTitle = file.name.replace(/\.[^.]+$/, "");
  S.compose.videoDuration = null;
  $("#video-block").innerHTML = composeVideoBlock();
  const v = $("#video-block video");
  if (v) v.addEventListener("loadedmetadata", () => {
    if (isFinite(v.duration)){
      S.compose.videoDuration = Math.round(v.duration);
      const meta = $("#video-block .video-meta .c");
      if (meta) meta.textContent = durLabel(S.compose.videoDuration) + " · Uploaded from disk";
    }
  });
}
function saveVideoDraft(){
  syncComposeFields();
  const c = S.compose;
  const langLine = c.lang !== "en" ? " (" + (LANG_NAMES[c.lang] || c.lang) + ")" : "";
  const id = "demo-draft-" + Date.now();
  const body = (c.intro || STARTERS[c.lang]) + "\n\n[Video: " + (c.videoTitle || "Video message") + "]\n\n" + (c.closing || CLOSERS[c.lang]);
  DATA.conversations.unshift({
    id, subject: (c.subject || "A quick video for you") + "", channel:"video", awaiting_reply:false, hours_ago:0,
    with_name: c.to || "New recipient", language: c.lang, owner: (DATA.viewer && DATA.viewer.name) || "",
    messages: [{
      channel:"video", direction:"outbound", body, status:"draft", preparedByAi:false, translationEn:null,
      video: { demo:true, title: c.videoTitle || (c.subject || "Video message"), caption: "Video message" + langLine,
        durationSeconds: c.videoDuration != null ? c.videoDuration : 0 },
      hoursAgo: 0, author: (DATA.viewer && DATA.viewer.name) || ""
    }]
  });
  S.savedNote = "Draft saved to Conversations — in a live build this would wait for your review before sending.";
  S.compose = { lang:"en", videoTitle:null, videoDuration:null, videoUrl:null, videoSource:null };
  location.hash = "#/conversations/" + id;
}

/* ======================= events ======================= */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const act = el.getAttribute("data-action");
  switch (act){
    case "ask": askAssistant(el.getAttribute("data-q")); break;
    case "approve":
      S.approvals[el.getAttribute("data-id")] = "approved";
      $("#queue").innerHTML = queueHtml();
      renderSidebar();
      break;
    case "skip":
      S.approvals[el.getAttribute("data-id")] = "skipped";
      $("#queue").innerHTML = queueHtml();
      renderSidebar();
      break;
    case "pl-view": S.pipeline.view = el.getAttribute("data-view"); render(); break;
    case "pl-mode": S.pipeline.mode = el.getAttribute("data-mode"); render(); break;
    case "pl-attn": S.pipeline.attn = !S.pipeline.attn; render(); break;
    case "pl-clear": Object.assign(S.pipeline, { owner:"all", source:"all", amt:"all", act:"all", attn:false }); render(); break;
    case "open-person": location.hash = "#/people/" + el.getAttribute("data-id"); break;
    case "people-tab": S.people.tab = el.getAttribute("data-tab"); render(); $("#people-q") && $("#people-q").focus(); break;
    case "people-lang": {
      const l = el.getAttribute("data-lang");
      const i = S.people.langs.indexOf(l);
      if (i >= 0) S.people.langs.splice(i,1); else S.people.langs.push(l);
      render();
      break;
    }
    case "people-import": S.people.panel = S.people.panel === "import" ? null : "import"; render(); break;
    case "bulk-open": S.people.panel = el.getAttribute("data-panel"); render(); break;
    case "bulk-close": S.people.panel = null; render(); break;
    case "bulk-clear": S.people.sel = {}; S.people.panel = null; render(); break;
    case "bulk-csv": exportSelectedCsv(); break;
    case "bulk-task-save": {
      const title = ($("#bulk-task-title") && $("#bulk-task-title").value.trim()) || "Follow up";
      const n = selectedPeople().length;
      selectedPeople().forEach(p => {
        (S.personTasks[p.id] = S.personTasks[p.id] || []).push(title);
      });
      S.people.note = 'Task "' + title + '" added for ' + n + " people — in this demo session only. In the live app these land on each owner's Today queue.";
      S.people.panel = null;
      render();
      break;
    }
    case "bulk-campaign-save": {
      const cid = $("#bulk-campaign") && $("#bulk-campaign").value;
      const camp = campaignById(cid);
      const n = selectedPeople().length;
      selectedPeople().forEach(p => {
        (S.enrollments[p.id] = S.enrollments[p.id] || []).push(camp ? camp.name : "Campaign");
      });
      S.people.note = n + ' people added to "' + (camp ? camp.name : "campaign") + '" — recorded in this demo session only. Nothing sends without approval.';
      S.people.panel = null;
      render();
      break;
    }
    case "person-act": S.person.action = el.getAttribute("data-kind"); S.savedNote = null; render(); break;
    case "person-cancel": S.person.action = null; render(); break;
    case "person-video": {
      const p = DATA.people.find(x => x.id === el.getAttribute("data-id"));
      if (p){ S.compose.to = personName(p); S.compose.lang = ["en","es","vi","ru"].includes(p.language) ? p.language : "en"; }
      break; // the <a href="#/compose"> handles navigation
    }
    case "person-save": {
      const kind = el.getAttribute("data-kind");
      const p = DATA.people.find(x => x.id === el.getAttribute("data-id"));
      if (!p) break;
      if (kind === "email" || kind === "sms"){
        const subject = ($("#pa-subject") && $("#pa-subject").value.trim()) || (kind === "email" ? "A quick note" : "Text message");
        const body = ($("#pa-body") && $("#pa-body").value.trim()) || "";
        const id = addDraftThread(p, kind, subject, body);
        S.conv.note = (kind === "email" ? "Email" : "Text") + " draft saved to Conversations — nothing sends from this demo.";
        S.person.action = null;
        location.hash = "#/conversations/" + id;
      } else if (kind === "task"){
        const t = ($("#pa-body") && $("#pa-body").value.trim()) || "Follow up";
        (S.personTasks[p.id] = S.personTasks[p.id] || []).push(t);
        S.savedNote = "Task added — in this demo session only.";
        S.person.action = null;
        render();
      } else if (kind === "note"){
        const t = ($("#pa-body") && $("#pa-body").value.trim()) || "";
        if (t) (S.personNotes[p.id] = S.personNotes[p.id] || []).push(t);
        S.savedNote = "Note added — internal, and in this demo session only.";
        S.person.action = null;
        render();
      } else if (kind === "campaign"){
        const cid = $("#pa-campaign") && $("#pa-campaign").value;
        const camp = campaignById(cid);
        (S.enrollments[p.id] = S.enrollments[p.id] || []).push(camp ? camp.name : "Campaign");
        S.savedNote = "Added to \"" + (camp ? camp.name : "campaign") + "\" — recorded in this demo session only. Nothing sends without approval.";
        S.person.action = null;
        render();
      }
      break;
    }
    case "partners-tab": S.partners.tab = el.getAttribute("data-tab"); render(); break;
    case "conv-filter": S.conv.filter = el.getAttribute("data-filter"); location.hash = "#/conversations"; render(); break;
    case "reply-save": {
      const conv = DATA.conversations.find(c => c.id === el.getAttribute("data-id"));
      const body = $("#reply-body") && $("#reply-body").value.trim();
      if (conv && body){
        conv.messages.unshift({ channel: conv.channel, direction:"outbound", body, status:"draft",
          preparedByAi:false, translationEn:null, video:null, hoursAgo:0,
          author: (DATA.viewer && DATA.viewer.name) || "" });
        S.conv.note = "Draft saved to this thread — in a live build it would wait for approval before sending.";
        render();
        S.conv.note = null;
      }
      break;
    }
    case "conv-new-save": {
      const pid = $("#cn-person") && $("#cn-person").value;
      const p = DATA.people.find(x => x.id === pid);
      if (!p){
        S.convNew.personId = "";
        const selEl = $("#cn-person");
        if (selEl) selEl.focus();
        break;
      }
      const channel = ($("#cn-channel") && $("#cn-channel").value) || "email";
      const subject = ($("#cn-subject") && $("#cn-subject").value.trim()) || "New message";
      const body = ($("#cn-body") && $("#cn-body").value.trim()) || "";
      const id = addDraftThread(p, channel, subject, body);
      S.convNew = { personId:"", channel:"email" };
      S.conv.note = "Draft saved — in a live build this would wait for your review before sending.";
      location.hash = "#/conversations/" + id;
      break;
    }
    case "camp-edit": S.campaign.editing = S.campaign.editing === el.getAttribute("data-id") ? null : el.getAttribute("data-id"); render(); break;
    case "camp-save": {
      const id = el.getAttribute("data-id");
      const base = campaignById(id);
      if (base){
        const edits = S.campaignEdits[id] = S.campaignEdits[id] || {};
        const nm = $("#ce-name") && $("#ce-name").value.trim();
        const bd = $("#ce-body") && $("#ce-body").value;
        if (nm) edits.name = nm;
        if (bd != null){ if (base.email_body != null) edits.email_body = bd; else edits.sms_body = bd; }
        S.campaign.notes[id] = "Changes saved in this demo session only — the seeded dataset on disk is untouched.";
      }
      S.campaign.editing = null;
      render();
      break;
    }
    case "camp-dup": {
      const base = campaignById(el.getAttribute("data-id"));
      if (base){
        const src = campaignView(base);
        const id = "copy-" + Date.now();
        S.extraCampaigns.push(Object.assign({}, src, {
          id, name:"Copy of " + src.name, status:"draft",
          sent_count:0, open_count:0, reply_count:0, created_days_ago:0,
          owner: (DATA.viewer && DATA.viewer.name) || src.owner
        }));
        S.campaign.notes[id] = "Duplicated as a draft in this demo session. It goes nowhere until it is scheduled — and nothing sends from this build.";
        location.hash = "#/marketing/campaign/" + id;
      }
      break;
    }
    case "camp-pause": {
      const id = el.getAttribute("data-id");
      (S.campaignEdits[id] = S.campaignEdits[id] || {}).status = "paused";
      S.campaign.notes[id] = "Paused in this demo session. In the live app nothing else would go out to this audience.";
      render();
      break;
    }
    case "camp-activate": {
      const id = el.getAttribute("data-id");
      (S.campaignEdits[id] = S.campaignEdits[id] || {}).status = "running";
      S.campaign.notes[id] = ACTIVATE_HONESTY;
      render();
      break;
    }
    case "camp-preview": S.campaign.preview = el.getAttribute("data-mode"); render(); break;
    case "auto-test": {
      const a = DATA.automations.find(x => x.id === el.getAttribute("data-id"));
      if (a){
        (S.autoRuns[a.id] = S.autoRuns[a.id] || []).unshift({
          status:"test", outcome: TEST_RUN_OUTCOME[a.tier] || TEST_RUN_OUTCOME.t3, person:null, daysAgo:0
        });
        S.autoNote = 'Test run recorded for "' + a.name + '" — nothing was sent, and nothing left this file.';
        render();
        const card = document.getElementById("auto-" + (a.ref || a.id));
        if (card) card.scrollIntoView({ block:"center" });
        S.autoNote = null;
      }
      break;
    }
    case "auto-pause": {
      const a = DATA.automations.find(x => x.id === el.getAttribute("data-id"));
      if (a){
        const cur = S.autoState[a.id] || a.status;
        S.autoState[a.id] = cur === "active" ? "paused" : "active";
        S.autoNote = '"' + a.name + '" is now ' + (S.autoState[a.id] === "active" ? "active" : "paused") +
          " — in this demo session only.";
        render();
        S.autoNote = null;
      }
      break;
    }
    case "intel-range": {
      const k = el.getAttribute("data-range");
      if (k === "custom"){ S.intel.customNote = true; }
      else { S.intel.range = k; S.intel.customNote = false; }
      render();
      break;
    }
    case "intel-custom-close": S.intel.customNote = false; render(); break;
    case "intel-scope": S.intel.scope = el.getAttribute("data-scope"); render(); break;
    case "team-tab": S.team.tab = el.getAttribute("data-tab"); render(); break;
    case "lb-period": S.team.period = el.getAttribute("data-period"); render(); break;
    case "team-select":
      S.team.sel = el.getAttribute("data-id");
      $("#team-detail").innerHTML = teamDetailHtml(DATA.team.find(t => t.id === S.team.sel) || null);
      break;
    case "videos-cat": S.videos.cat = el.getAttribute("data-cat"); render(); break;
    case "record-video": syncComposeFields(); startRecording(); break;
    case "stop-record": stopRecording(); break;
    case "save-draft": saveVideoDraft(); break;
  }
});
document.addEventListener("submit", e => {
  const f = e.target.closest("[data-action='ask-form']");
  if (f){
    e.preventDefault();
    const inp = $("#ai-input");
    if (inp && inp.value.trim()){ askAssistant(inp.value); inp.value = ""; }
  }
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.id === "people-q"){ S.people.q = el.value; $("#people-list").innerHTML = peopleRows(); }
  else if (el.id === "tpl-q"){ S.marketing.q = el.value; $("#tpl-list").innerHTML = templateRows(); }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "cmp-lang"){
    syncComposeFields();
    const prevLang = S.compose.lang;
    if (S.compose.intro === STARTERS[prevLang] || S.compose.intro == null) S.compose.intro = null;
    if (S.compose.closing === CLOSERS[prevLang] || S.compose.closing == null) S.compose.closing = null;
    S.compose.lang = el.value;
    render();
  } else if (el.id === "video-file"){
    syncComposeFields();
    handleVideoFile(el.files && el.files[0]);
  } else if (el.id === "pl-owner"){ S.pipeline.owner = el.value; render(); }
  else if (el.id === "pl-source"){ S.pipeline.source = el.value; render(); }
  else if (el.id === "pl-amt"){ S.pipeline.amt = el.value; render(); }
  else if (el.id === "pl-act"){ S.pipeline.act = el.value; render(); }
  else if (el.id === "cn-person"){
    S.convNew.personId = el.value;
    S.convNew.subject = ($("#cn-subject") && $("#cn-subject").value) || "";
    S.convNew.body = ($("#cn-body") && $("#cn-body").value) || "";
    render();
  }
  else if (el.id === "cn-channel"){ S.convNew.channel = el.value; }
  else if (el.classList && el.classList.contains("rowcheck")){
    const id = el.getAttribute("data-person");
    if (el.checked) S.people.sel[id] = true; else delete S.people.sel[id];
    render();
  }
});
window.addEventListener("hashchange", () => {
  if (S.savedNote && !/^#\/(marketing|conversations|people)/.test(location.hash)) S.savedNote = null;
  if (!/^#\/conversations/.test(location.hash)) S.conv.note = null;
  if (!/^#\/people\//.test(location.hash)) S.person.action = null;
  stopRecording();
  render();
});
function boot(){ render(); }
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();
</script>
